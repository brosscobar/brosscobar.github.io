<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Mira Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<style>
/* Layout: iPhone frame left, notes + screen map right. Tokens = Mira Design System v0.1 (see mira-design-system.html). Structure and interaction patterns follow Tiimo; artwork and styling are Mira's own. */
:root{
  /* DS v0.1 roles, aliased to the prototype's names */
  --page:#efedf5; --text:#1c1830;
  --bg:#f7f5fc; --card:#ffffff; --ink:#1c1830; --muted:#6f6a82; --line:#e4e0ef; --line-strong:#cfc9e0; --faint:#a9a3bd;
  --accent:#6a4bea; --accent-deep:#5a3fd6; --accent-soft:#ede8ff; --accent-tint:#f5f2ff; --accent-300:#c3b2fd; --accent-400:#a38bfa;
  --good:#2f9e74; --good-soft:#ddf3e8; --warn:#d98a2b; --warn-soft:#fdeedc; --urgent:#d2524d; --urgent-soft:#fbe3e1; --info-soft:#e4e8ff;
  --on-urgent:#9c3532; --on-warn:#8a5410; --on-info:#3f42a8; --on-good:#1f6e4f;
  --shadow:0 8px 28px rgba(40,30,20,.14); --e1:0 1px 2px rgba(28,24,48,.05),0 2px 10px rgba(40,30,20,.06);
  --display:"Fraunces","Iowan Old Style",Georgia,serif; --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Roboto","Segoe UI",system-ui,sans-serif; --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --d-fast:150ms; --d-base:220ms; --d-slow:320ms; --ease:cubic-bezier(.2,0,0,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:#17151e;--text:#ececea;color-scheme:dark}}
:root[data-theme="dark"]{--page:#17151e;--text:#ececea;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--page);color:var(--text);font-family:var(--sans);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px;font-size:14px}
h1.page{font-family:var(--display);font-size:22px;margin:0 0 2px;font-weight:500;color:var(--text)}
.sub{color:var(--muted);font-size:13px;margin:0 0 16px}
.wrap{display:grid;grid-template-columns:420px minmax(0,1fr);gap:28px;max-width:1120px;margin:0 auto}
@media (max-width:860px){.wrap{grid-template-columns:1fr}}

/* ---------- phone ---------- */
.phone{width:100%;max-width:420px;height:852px;border-radius:50px;background:#111;padding:12px;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.inner{position:relative;height:100%;border-radius:40px;overflow:hidden;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
.status{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:14px;font-weight:600;color:var(--ink);flex:none}
.notch{position:absolute;left:50%;top:12px;transform:translateX(-50%);width:120px;height:34px;background:#111;border-radius:20px;z-index:5}
.screen{flex:1;overflow-y:auto;padding:4px 20px 120px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen h2{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.1;margin:14px 0 8px;letter-spacing:-.01em;text-wrap:balance}
.screen h2.big{font-size:40px}
.screen h3{font-family:var(--display);font-weight:400;font-size:22px;margin:24px 0 10px}
.screen p{margin:0 0 8px;color:var(--muted);line-height:1.5;font-size:14px}
.muted{color:var(--muted)}.small{font-size:12px}.center{text-align:center}
.serif{font-family:var(--display);font-weight:400}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stack{display:flex;flex-direction:column;gap:10px}
.hrow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin:0 -20px;padding-left:20px;padding-right:20px}
.hrow::-webkit-scrollbar{display:none}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 4px;min-height:44px}
.ib{width:40px;height:40px;border-radius:50%;background:var(--card);box-shadow:0 2px 10px rgba(40,30,20,.08);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;flex:none}
.pillbtn{background:var(--card);border-radius:999px;padding:9px 14px;font-weight:600;font-size:14px;box-shadow:0 2px 10px rgba(40,30,20,.08);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.pillbtn.soft{background:var(--accent-soft);color:var(--accent-deep)}
.prog{height:5px;background:var(--accent-soft);border-radius:3px;overflow:hidden;flex:1;margin:0 14px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:3px}
.skip{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.06em;cursor:pointer}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border-radius:999px;padding:16px;font-weight:700;font-size:15px;background:var(--ink);color:#fff;cursor:pointer;margin-top:12px;border:0;font-family:inherit}
.btn.accent{background:var(--accent)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.disabled{background:#d9d5e6;color:#8d88a3}
.btn.sm{width:auto;padding:10px 16px;font-size:13px;margin:0;display:inline-flex}
.link{font-weight:700;text-decoration:underline;cursor:pointer}

/* options (Tiimo single-select) */
.opt{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:999px;padding:14px 20px;margin:10px 0;font-weight:600;font-size:15px;box-shadow:inset 0 0 0 1.5px var(--line);cursor:pointer}
.opt.on{box-shadow:inset 0 0 0 2px var(--ink)}
.opt.card{border-radius:16px;align-items:flex-start;font-weight:500}
.chipgrid{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:9px 14px;font-size:13px;font-weight:600;box-shadow:inset 0 0 0 1.5px var(--line);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent);color:var(--accent-deep)}
.chip.quiet{box-shadow:none;background:var(--accent-tint)}
.field{background:var(--card);border-radius:16px;padding:14px 16px;margin:8px 0;color:var(--muted);font-size:15px;box-shadow:inset 0 0 0 1.5px var(--line)}
.field b{color:var(--ink);font-weight:600}
.kv{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv .v{background:var(--accent-tint);border-radius:999px;padding:5px 10px;font-weight:600;font-size:13px}

/* cards */
.card{background:var(--card);border-radius:20px;padding:16px;margin:10px 0;box-shadow:0 2px 12px rgba(40,30,20,.06)}
.card.soft{background:var(--accent-soft);box-shadow:none}
.card.tint{background:var(--accent-tint);box-shadow:none}
.hero{background:linear-gradient(180deg,#ede8ff 0%,#f7f5fc 100%);border-radius:24px;padding:22px 18px 18px;text-align:center;margin:8px 0}
.hero .count{font-family:var(--display);font-size:56px;font-weight:400;line-height:1;letter-spacing:-.02em}
.bar{height:10px;background:#fff;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.bar.thin{height:6px;background:var(--accent-soft)}

/* groups + tasks (Tiimo sections) */
.grp{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:7px 12px;margin:16px 0 6px}
.grp.urgent{background:var(--urgent-soft);color:#a33b37}
.grp.week{background:var(--warn-soft);color:#9a5e12}
.grp.later{background:var(--info-soft);color:#4a4db5}
.grp.done{background:var(--good-soft);color:#1f7a57}
.grp.neutral{background:var(--accent-soft);color:var(--accent-deep)}
.grp-row{display:flex;align-items:center;justify-content:space-between}
.grp-row .plus{color:var(--muted);font-size:18px;margin-top:10px}
.task{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:12px 14px;margin:8px 0;box-shadow:0 2px 12px rgba(40,30,20,.06);cursor:pointer;position:relative}
.task .ico{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.task .ico.g{background:var(--good-soft)}.task .ico.w{background:var(--warn-soft)}.task .ico.u{background:var(--urgent-soft)}
.task .body{flex:1;min-width:0}
.task .ttl{font-weight:600;font-size:15px;line-height:1.3}
.task .meta{font-size:12px;color:var(--muted);margin-top:2px}
.task .tip{font-size:12px;color:var(--accent-deep);margin-top:6px;display:flex;gap:6px;align-items:flex-start}
.task .tip:before{content:"✦";flex:none}
.task.isdone .ttl{text-decoration:line-through;color:var(--muted)}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
.check.on{background:var(--good);border-color:var(--good)}
.subbar{height:4px;background:var(--accent-soft);border-radius:2px;margin-top:8px;width:60%}
.subbar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.addrow{border:1.5px dashed var(--line);border-radius:18px;padding:14px 16px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;margin:8px 0;font-size:14px;cursor:pointer}

/* week strip (Tiimo) */
.week{display:flex;justify-content:space-between;align-items:center;margin:12px 0 4px}
.week .d{width:40px;text-align:center;cursor:pointer}
.week .d b{display:block;width:34px;height:34px;line-height:34px;border-radius:50%;margin:0 auto;font-weight:700;font-size:14px}
.week .d span{display:block;font-size:10px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.04em}
.week .d.on b{background:var(--ink);color:#fff}
.week .d.dot b{box-shadow:inset 0 0 0 2px var(--accent-soft)}
.week .arrow{color:var(--muted);font-size:20px}

/* nav (floating pill) */
.nav{position:absolute;left:14px;right:14px;bottom:18px;background:var(--card);border-radius:999px;display:flex;align-items:flex-end;justify-content:space-around;padding:8px 6px;box-shadow:var(--shadow);z-index:4}
.nav .it{width:64px;text-align:center;cursor:pointer;color:var(--muted);font-size:10px;font-weight:600;padding:4px 0}
.nav .it .ic{width:40px;height:40px;border-radius:50%;margin:0 auto 2px;display:flex;align-items:center;justify-content:center;font-size:18px}
.nav .it.on{color:var(--accent-deep)}
.nav .it.on .ic{background:var(--accent-soft)}
.mira-btn{width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#b9a4ff,#7b5cf5 60%,#5a3fd6);display:flex;align-items:center;justify-content:center;margin:-30px auto 2px;box-shadow:0 10px 24px rgba(123,92,245,.45);cursor:pointer}
.face{width:30px;height:30px;position:relative}
.face:before,.face:after{content:"";position:absolute;top:9px;width:5px;height:5px;border-radius:50%;background:#fff}
.face:before{left:6px}.face:after{right:6px}
.face i{position:absolute;left:7px;right:7px;bottom:6px;height:8px;border:2.5px solid #fff;border-top:0;border-radius:0 0 12px 12px}
.fab{position:absolute;right:18px;bottom:96px;z-index:4}
.fab .mira-btn{margin:0}

/* sheets */
.scrim{position:absolute;inset:0;background:rgba(28,24,48,.35);z-index:6}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:86%;overflow-y:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 20px 30px;z-index:7;box-shadow:0 -10px 40px rgba(0,0,0,.2);scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
.handle{width:40px;height:5px;border-radius:3px;background:#cfc9e3;margin:4px auto 14px}
.menu{position:absolute;left:20px;right:20px;top:220px;background:var(--card);border-radius:22px;padding:8px;z-index:7;box-shadow:var(--shadow)}
.menu div{padding:13px 14px;font-weight:600;font-size:15px;border-radius:14px;display:flex;gap:12px;align-items:center;cursor:pointer}
.menu div.danger{color:var(--urgent)}

/* chat */
.bub{max-width:84%;border-radius:18px;padding:12px 14px;font-size:14px;line-height:1.45;margin:6px 0}
.bub.me{margin-left:auto;background:var(--card);border-bottom-right-radius:6px}
.bub.ai{background:var(--accent-soft);border-bottom-left-radius:6px;color:var(--ink)}
.ask{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:999px;padding:8px 8px 8px 18px;box-shadow:var(--shadow);margin-top:12px}
.ask span{flex:1;color:var(--muted);font-family:var(--display);font-size:16px}
.ask .speak{background:var(--ink);color:#fff;border-radius:999px;padding:10px 14px;font-weight:700;font-size:13px}
.avatar{width:72px;height:72px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#b9a4ff,#7b5cf5 60%,#5a3fd6);margin:8px auto;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 30px rgba(123,92,245,.35)}
.avatar .face{width:40px;height:40px}.avatar .face:before,.avatar .face:after{top:12px;width:6px;height:6px}.avatar .face:before{left:9px}.avatar .face:after{right:9px}.avatar .face i{left:10px;right:10px;bottom:8px;height:10px}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:8px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:11px 6px;border-bottom:1px solid var(--line)}
.tag{display:inline-block;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700;background:var(--accent-soft);color:var(--accent-deep)}
.tag.g{background:var(--good-soft);color:#1f7a57}.tag.w{background:var(--warn-soft);color:#9a5e12}.tag.u{background:var(--urgent-soft);color:#a33b37}.tag.n{background:#eeecf4;color:var(--muted)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0}
.grid4 .m{text-align:center;cursor:pointer}
.grid4 .m .ic{width:56px;height:56px;border-radius:50%;background:var(--card);box-shadow:0 2px 12px rgba(40,30,20,.08);display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 6px}
.grid4 .m span{font-size:11px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photo{border-radius:16px;aspect-ratio:4/3;background:linear-gradient(135deg,#d9cffb,#f3ecff);display:flex;align-items:flex-end;padding:10px;font-size:12px;font-weight:600}
.photo.sq{aspect-ratio:1}
.hour{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:start;margin:6px 0}
.hour .h{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:14px}
.ring{width:150px;height:150px;border-radius:50%;margin:10px auto;background:conic-gradient(var(--accent) var(--p,34%),var(--accent-soft) 0);display:flex;align-items:center;justify-content:center}
.ring b{width:118px;height:118px;border-radius:50%;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);font-size:34px;font-weight:500}
.ring b small{font-family:var(--sans);font-size:11px;color:var(--muted);font-weight:600}
.illus{height:200px;border-radius:28px;background:radial-gradient(circle at 30% 30%,#fff 0,#ede8ff 35%,#c9b8ff 70%,#9d85f7 100%);position:relative;overflow:hidden;margin:10px 0}
.illus:before,.illus:after{content:"";position:absolute;border-radius:50%;border:14px solid rgba(255,255,255,.55)}
.illus:before{width:220px;height:220px;left:-60px;top:40px}.illus:after{width:160px;height:160px;right:-40px;top:-50px}
.qr{width:110px;height:110px;margin:10px auto;border-radius:12px;background:repeating-linear-gradient(90deg,var(--ink) 0 6px,transparent 6px 12px),repeating-linear-gradient(0deg,var(--ink) 0 6px,#fff 6px 12px);background-blend-mode:multiply;opacity:.85}
.toast{position:absolute;left:20px;right:20px;top:60px;background:var(--accent);color:#fff;border-radius:16px;padding:12px 16px;font-weight:600;text-align:center;z-index:8;font-size:14px}
.commit{display:flex;align-items:center;background:var(--ink);border-radius:999px;padding:6px;color:#fff;margin-top:16px;cursor:pointer}
.commit .knob{width:50px;height:50px;border-radius:50%;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:20px}
.commit span{flex:1;text-align:center;font-weight:700;font-size:15px}
.price{font-family:var(--display);font-size:30px;font-weight:500}
.plan{flex:1;background:var(--card);border-radius:20px;padding:16px;text-align:center;box-shadow:inset 0 0 0 1.5px var(--line);position:relative}
.plan.on{box-shadow:inset 0 0 0 2px var(--ink)}
.plan .badge{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;font-size:10px;font-weight:700;letter-spacing:.06em;border-radius:999px;padding:4px 10px}

/* side panel */
.side{min-width:0}
.side h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0 0 4px}
.side .meta{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:10px}
.side .n{font-size:13px;line-height:1.55}
.side .n p{margin:0 0 8px}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.ctrl button,.map button{font:inherit;font-size:12px;font-weight:600;border:1.5px solid rgba(128,120,160,.45);background:transparent;color:var(--text);border-radius:999px;padding:7px 12px;cursor:pointer}
.ctrl button.on,.map button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.side{color:var(--text)}
.map{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.map button{border-radius:8px;padding:5px 9px;font-weight:500}
.map .lbl{width:100%;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:8px}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

button.ib{border:0;padding:0;color:var(--ink);font:inherit;-webkit-appearance:none;appearance:none}
.ib svg{display:block}
/* ===== Timeline v2 (DS components: header, strip, accordion, suggestions) ===== */
.tl-bar{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;height:56px;margin:0 -20px;padding:0 20px;transition:background var(--d-base) var(--ease),box-shadow var(--d-base) var(--ease)}
.tl-bar .fade{transition:opacity var(--d-base) var(--ease)}
.tl-bar .ctitle{position:absolute;left:50%;top:50%;transform:translate(-50%,-35%);text-align:center;opacity:0;pointer-events:none;transition:opacity var(--d-base) var(--ease),transform var(--d-base) var(--ease);line-height:1.15}
.tl-bar .ctitle b{display:block;font:600 17px/22px var(--sans)}
.tl-bar .ctitle span{display:block;font:400 13px/16px var(--sans);color:var(--muted)}
.tl-bar .plusbtn{transition:background var(--d-base) var(--ease),color var(--d-base) var(--ease),box-shadow var(--d-base) var(--ease)}
.tl-bar.compact{background:rgba(247,245,252,.96);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 1px 0 var(--line)}
.tl-bar.compact .fade{opacity:0;pointer-events:none}
.tl-bar.compact .ctitle{opacity:1;transform:translate(-50%,-50%)}
.tl-bar.compact .plusbtn{background:var(--accent);color:#fff;box-shadow:0 6px 16px rgba(106,75,234,.35)}
.tl-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:2px}
.tl-head .day{font:400 34px/40px var(--display);letter-spacing:-.015em;margin:0}
.monthbtn{display:inline-flex;align-items:center;gap:4px;height:44px;padding:0 0 0 8px;background:none;border:0;font:600 17px/22px var(--sans);color:var(--accent-deep);cursor:pointer}
.strip2{display:grid;grid-template-columns:repeat(7,1fr);margin:10px 0 12px}
.strip2 .d{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0;background:none;border:0;color:inherit;font:inherit;cursor:pointer}
.strip2 .l{font:600 12px/16px var(--sans);color:var(--faint)}
.strip2 .n{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:600 17px/22px var(--sans);font-variant-numeric:tabular-nums;transition:background var(--d-fast) var(--ease),color var(--d-fast) var(--ease)}
.strip2 .dot{width:5px;height:5px;border-radius:50%;background:transparent}
.strip2 .has .dot{background:var(--accent-400)}
.strip2 .today .n{box-shadow:inset 0 0 0 2px var(--accent);color:var(--accent)}
.strip2 .sel .n{background:var(--ink);color:#fff;box-shadow:none}
.strip2 .sel .l{color:var(--ink)}
.day0c{display:flex;align-items:center;gap:14px;background:var(--accent-soft);border-radius:24px;padding:14px 16px;cursor:pointer}
.day0c .big{font:400 36px/1 var(--display);font-variant-numeric:tabular-nums}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin:22px 0 2px}
.sec-h .t{font:400 22px/28px var(--display)}
.sec-h .s{font:400 13px/18px var(--sans);color:var(--muted)}
.refresh.spin svg{animation:rot1 500ms var(--ease)}
@keyframes rot1{to{transform:rotate(360deg)}}
.sugrow{display:flex;gap:10px;overflow-x:auto;margin:10px -20px 0;padding:2px 20px 10px;scrollbar-width:none;scroll-snap-type:x mandatory;scroll-padding:0 20px}
.sugrow::-webkit-scrollbar{display:none}
.sugg{width:236px;flex:none;scroll-snap-align:start;background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--e1);display:flex;flex-direction:column;gap:6px;animation:sugIn var(--d-base) var(--ease)}
@keyframes sugIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sugg .tp{display:flex;justify-content:space-between;align-items:flex-start}
.sugg .e{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:17px}
.sugg .x{width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--faint);cursor:pointer;margin:-6px -6px 0 0;border-radius:50%}
.sugg .ttl{font:600 15px/20px var(--sans)}
.sugg .why{font:400 12px/16px var(--sans);color:var(--muted);flex:1}
.sugg .add{align-self:flex-start;height:36px;padding:0 14px;border-radius:999px;background:var(--accent-soft);color:var(--accent-deep);font:600 14px/18px var(--sans);border:0;cursor:pointer;margin-top:4px}
.sugg.empty{align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:13px;background:var(--accent-tint);box-shadow:none}
.acc{margin:6px 0}
.acc-h{display:flex;align-items:center;width:100%;min-height:44px;background:none;border:0;padding:0;cursor:pointer;color:inherit;font:inherit;text-align:left;gap:10px}
.acc-h .lab{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;font:700 11px/14px var(--sans);letter-spacing:.08em;text-transform:uppercase;flex:none}
.lab.urgent{background:var(--urgent-soft);color:var(--on-urgent)}.lab.week{background:var(--warn-soft);color:var(--on-warn)}.lab.later{background:var(--info-soft);color:var(--on-info)}.lab.done{background:var(--good-soft);color:var(--on-good)}
.acc-h .chev{display:inline-block;transition:transform var(--d-base) var(--ease)}
.acc.open .acc-h .chev{transform:rotate(180deg)}
.acc-h .peek{flex:1;min-width:0;font:400 13px/18px var(--sans);color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity var(--d-base) var(--ease)}
.acc.open .acc-h .peek{opacity:0}
.acc-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--d-base) var(--ease)}
.acc.open .acc-b{grid-template-rows:1fr}
.acc-b>div{overflow:hidden;min-height:0}
.coach{display:flex;align-items:center;gap:8px;font:500 12px/16px var(--sans);color:var(--accent-deep);background:var(--accent-tint);border-radius:12px;padding:8px 12px;margin:2px 0 4px}
.av{width:18px;height:18px;border-radius:50%;background:#ddd3ff;display:inline-flex;align-items:center;justify-content:center;font:700 9px/1 var(--sans);color:#4730ab;vertical-align:-4px}
.task .ico.i{background:var(--info-soft)}
.task.flash{animation:flash 900ms var(--ease)}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent-300)}100%{box-shadow:var(--e1)}}
@media (prefers-reduced-motion:reduce){.tl-bar,.tl-bar *,.acc-b,.acc-h .chev,.sugg,.refresh svg{transition:none!important;animation:none!important}}
@media (prefers-reduced-motion:no-preference){.screen{scroll-behavior:smooth}}

/* ===== Collection (masonry + bottom action pill) ===== */
.masonry{columns:2;column-gap:10px}
.ctile{break-inside:avoid;margin:0 0 10px;border-radius:18px;position:relative;overflow:hidden;cursor:pointer;box-shadow:var(--e1);transition:transform var(--d-fast) var(--ease)}

.cfav{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--ink)}

.actpill{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);display:flex;align-items:center;background:var(--ink);color:#fff;border-radius:999px;padding:6px;box-shadow:0 10px 30px rgba(28,22,15,.3);z-index:4}

.actbar{position:absolute;left:14px;right:14px;bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--card);border-radius:22px;padding:10px 14px;box-shadow:var(--shadow);z-index:4;font:600 14px/18px var(--sans)}
.actbar span{cursor:pointer;padding:8px 6px}.actbar .danger{color:var(--urgent)}.actbar b{font-weight:600;color:var(--muted)}

/* =====================================================================

   bg #fafafa · cards #fff · ink #1d1b20 · lavender #efe6ff · purple #977fef · track #eae5fc

:root{

  --accent:#977fef; --accent-deep:#7c62e6; --accent-soft:#efe6ff; --accent-tint:#f5f0ff; --accent-300:#c9b8fb; --accent-400:#b4a2f5;
  --urgent-soft:#fad9da; --warn-soft:#fdeddf; --info-soft:#e7ebff; --good-soft:#d5f0e6; --good:#1fb486;
  --display:"Newsreader","Iowan Old Style",Georgia,serif;
  --e1:0 1px 3px rgba(0,0,0,.035);

/* =====================================================================
   ROUND 3 · Canela, Material icons, airy spacing (8 · 16 · 32 · 48)
   ===================================================================== */
:root{ --display:"Canela","Canela Web","Canela Text","Newsreader","Iowan Old Style",Georgia,serif; --sp-1:8px; --sp-2:16px; --sp-3:32px; --sp-4:48px; }
.mi{display:block;flex:none}
.screen{padding:8px 20px 140px}
/* section rhythm: 48 between sections, 16 title → content */
.f-h,.screen h3{margin:var(--sp-4) 0 var(--sp-2)}
.f-sec{margin:var(--sp-4) 0 var(--sp-2)}
.f-sec .f-chev,.f-chev{display:flex;align-items:center;color:var(--ink)}
.f-pro{margin-top:var(--sp-3);padding:32px 20px 24px}
.f-count{margin:var(--sp-4) 0 var(--sp-3)}
.f-card{padding:20px}
.f-budget{padding:24px 20px 20px}
.f-mira{margin-top:var(--sp-4);padding:24px 20px 28px}
.f-act{padding:16px 20px;margin:12px 0}
.f-grey{margin-top:var(--sp-2);height:44px}
.f-banner{margin-top:var(--sp-3)}
.f-search{margin-top:var(--sp-2)}
.f-art{margin-top:var(--sp-2)}
.f-colls{gap:24px 12px}
/* 8 quick links, 4 per row */
.f-quick{display:grid;grid-template-columns:repeat(4,1fr);gap:24px 8px;overflow:visible;margin:var(--sp-4) 0 0;padding:0}
.f-q{width:auto}
.f-q-c{margin:0 auto}
.f-q span{font-size:14px}
/* task rows: name only, more air */
.task{min-height:56px;padding:12px 16px 12px 12px;margin:12px 0;gap:14px}
.task .meta,.task .tip,.task .subbar{display:none}
.addrow{min-height:56px;margin:12px 0;padding:0 14px 0 16px}
.addrow .mi{color:#b4b2ad}
/* accordion: label + chevron centred inside the pill, same size everywhere */
.acc{margin:0 0 var(--sp-3)}
.acc-h{min-height:32px;gap:12px}
.acc-h .lab{height:32px;padding:0 10px 0 14px;gap:4px;display:inline-flex;align-items:center}
.acc-h .chev{display:inline-flex;align-items:center;transition:transform var(--d-base) var(--ease)}
.acc.open .acc-h .chev{transform:rotate(180deg)}
.acc-b>div{padding-top:4px}
.coach{margin:-16px 0 var(--sp-3)}
.sec-h+.acc{margin-top:0}
/* timeline rhythm */
.tl-head{margin-top:var(--sp-2)}
.strip2{margin:var(--sp-2) 0 var(--sp-3)}
.monthbtn{display:inline-flex;align-items:center;gap:2px}
.day0c{padding:20px;border-radius:20px}
.sec-h{margin:var(--sp-4) 0 var(--sp-2)}
.sugrow{margin-top:0;padding-bottom:4px}
.sugg{padding:16px;gap:8px}
.sugg .x{color:var(--faint)}
/* nav: Mira back in the centre */
.nav{align-items:flex-end;padding:8px}
.nav .it.mira-it{flex:0 0 72px;background:none!important;color:var(--purple)}
.nav .mira-btn{margin:-34px auto 4px;width:60px;height:60px}
.nav .it .ic{height:28px;display:flex;align-items:center;justify-content:center}
.grp,.pillbtn,.chip{display:inline-flex;align-items:center;gap:4px}

/* ===================== ROUND 4 ===================== */
/* accordion: tight like Tiimo — 12px between closed groups, 24px after an open one */
.acc{margin:0 0 12px}
.acc.open{margin-bottom:24px}
.acc-row{display:flex;align-items:center;gap:8px}
.acc-row .acc-h{flex:1;min-width:0}
.acc-add{width:32px;height:32px;border-radius:50%;background:#f1f0ee;color:#a9a7a2;display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer}
.acc-b>div{padding-top:4px}
.coach{margin:-4px 0 16px}
.grp{margin:12px 0 8px}
/* suggestions: compact cards, title only, three sources */
.sug-h{margin-bottom:12px}
.sugrow{gap:12px;padding-bottom:8px}
.sug2{flex:none;width:140px;height:140px;border-radius:22px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;scroll-snap-align:start;box-shadow:0 2px 10px rgba(0,0,0,.04);animation:sugIn var(--d-base) var(--ease)}
.sug2.mira{background:#efe6ff}.sug2.app{background:#eef1ff}.sug2.pro{background:#e6ea8d}
.sug2-top{display:flex;justify-content:space-between;align-items:flex-start}
.sug2-i{font-size:28px;line-height:1}
.sug2-x{color:var(--ink);width:28px;height:28px;margin:-6px -6px 0 0;display:flex;align-items:center;justify-content:center;border-radius:50%}
.sug2-t{font:400 15.5px/20px var(--sans);color:var(--ink)}
.sbadge{display:inline-block;font:700 10px/14px var(--sans);letter-spacing:.06em;border-radius:999px;padding:2px 8px;margin-bottom:6px}
.sbadge.mira{background:#fff;color:var(--purple-deep)}.sbadge.app{background:#fff;color:#4a5bd0}.sbadge.pro{background:#1d1b20;color:#e6ea8d}
.sug2.empty{width:auto;height:auto;justify-content:center;background:var(--accent-tint);color:var(--muted);font-size:13px;padding:16px 20px;cursor:default}
/* filter button + sheet */
.filterbtn{position:relative}
.fcount{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--purple);color:#fff;font:700 10px/18px var(--sans);text-align:center;padding:0 4px}
.fs-title{font:400 24px/30px var(--display)}
.fs-lbl{font:600 12px/16px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:24px 0 8px}
.fs-card{padding:4px 16px;margin:0}
.fs-row{display:flex;justify-content:space-between;align-items:center;min-height:50px;border-bottom:1px solid var(--line);font:400 16px/22px var(--sans);cursor:pointer}
.fs-row:last-child{border-bottom:0}
.fs-box{width:22px;height:22px;border-radius:6px;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;color:#fff}
.fs-box.on{background:var(--purple);border-color:var(--purple)}
.fs-radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink);box-sizing:border-box}
.fs-radio.on{border:7px solid var(--purple)}
.fsheet .btn{margin-top:24px}
/* Mira: Figma face (smiling eyes + smile), living gradient, plays on scroll */
.face::before,.face::after{display:none!important}
svg.face{width:40px;height:40px;overflow:visible}
.mira-btn .face{transform:none!important}
svg.face path{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
svg.face .eyes,svg.face .mouth{transform-box:fill-box;transform-origin:center}
.mira-btn{position:relative;overflow:hidden;background:linear-gradient(140deg,#8f74fb 0%,#a58ffe 35%,#cfc2fb 65%,#9a82fc 100%);background-size:260% 260%;animation:miraGrad 9s ease-in-out infinite;transition:filter .6s var(--ease),box-shadow .6s var(--ease)}
.mira-btn::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 28% 22%,rgba(255,255,255,.55),transparent 46%);animation:miraGlow 7s ease-in-out infinite;pointer-events:none}
.mira-btn svg.face{position:relative;z-index:1}
svg.face .eyes{animation:miraBlink 5.5s infinite}
.mira-btn.playing{animation-duration:2.4s;filter:hue-rotate(-8deg) saturate(1.25) brightness(1.03);box-shadow:0 12px 30px rgba(151,127,239,.6)}
.mira-btn.playing svg.face .eyes{animation:miraLook 1.2s ease-in-out infinite}
.mira-btn.playing svg.face .mouth{animation:miraTalk 1.2s ease-in-out infinite}
@keyframes miraGrad{0%{background-position:0% 30%}50%{background-position:100% 70%}100%{background-position:0% 30%}}
@keyframes miraGlow{0%,100%{transform:translate(0,0)}50%{transform:translate(8%,6%)}}
@keyframes miraBlink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.15)}97%{transform:scaleY(1)}}
@keyframes miraLook{0%,100%{transform:translate(0,0)}25%{transform:translate(-2.5px,-1px)}50%{transform:translate(2.5px,-1px)}75%{transform:translate(0,1px) scaleY(.5)}}
@keyframes miraTalk{0%,100%{transform:scale(1)}30%{transform:scale(1.18,1.4)}60%{transform:scale(.88,.75)}}
@media (prefers-reduced-motion:reduce){.mira-btn,.mira-btn::after,svg.face .eyes,svg.face .mouth{animation:none!important}}

/* ===== ROUND 5 · single suggestion card (Tiimo tip card) ===== */
.tiprow{margin:8px 0 0}
.tiprow:empty{display:none}
.tipcard{position:relative;display:flex;align-items:center;gap:16px;border-radius:24px;padding:20px 52px 20px 20px;cursor:pointer;border:1px solid rgba(0,0,0,.04);animation:sugIn var(--d-base) var(--ease)}
.tipcard.mira{background:#f3eeff}.tipcard.app{background:#eef1f7}.tipcard.pro{background:#f2f4cf}
.tipcard-i{font-size:40px;line-height:1;flex:none;width:56px;text-align:center}
.tipcard-b{min-width:0}
.tipcard-t{font:600 17px/22px var(--sans);color:var(--ink)}
.tipcard-s{font:400 14.5px/20px var(--sans);color:#8e8b94;margin-top:4px}
.tipcard .sbadge{margin-bottom:6px}
.tipcard-x{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;background:rgba(29,27,32,.08);color:#6f6d72;display:flex;align-items:center;justify-content:center}
.tiprow+.sec-h{margin-top:32px}

/* ===== ROUND 6 · tip card + rhythm matched to Tiimo ===== */
.tiprow{margin:20px 0 28px}
.tipcard,.tipcard.mira,.tipcard.app,.tipcard.pro{background:#f1f3f7;border:1px solid #e7e9ef;border-radius:28px;padding:18px 56px 18px 20px;gap:18px;align-items:center;box-shadow:none}
.tipcard-i{width:48px;font-size:0;color:#1d1b20;display:flex;justify-content:center}
.tipcard-t{font:600 17px/22px var(--sans);color:#1d1b20}
.tipcard-s{font:400 15px/20px var(--sans);color:#9a99a1;margin-top:2px}
.tipcard-x{top:12px;right:12px;width:28px;height:28px;background:#dcdde3;color:#55545b}
.tc-pro{display:inline-block;vertical-align:2px;font:700 9.5px/14px var(--sans);letter-spacing:.06em;color:#6f6d72;border:1px solid #cfd1d8;border-radius:999px;padding:0 6px}
.tiprow:empty+*{margin-top:24px}
/* groups: Tiimo rhythm — 12px pill→content, 12px between rows, 20px before the next pill */
.acc{margin:0 0 20px}
.acc.open{margin-bottom:20px}
.acc-b>div{padding-top:0}
.acc-b .task:first-child{margin-top:12px}
.task{margin:0 0 12px}
.acc-b .addrow{margin:0}
.coach{margin:-8px 0 20px}

/* ===== on a real phone: full-screen app, no frame, no notes ===== */
@media (max-width:540px){
  html,body{height:100%}
  body{padding:0;background:var(--bg)}
  h1.page,.sub,.side,.ctrl,.notch,.status{display:none!important}
  .wrap{display:block;max-width:none}
  .phone{max-width:none;width:100%;height:100vh;height:100dvh;border-radius:0;padding:0;background:none;box-shadow:none}
  .inner{border-radius:0}
  .screen{padding-top:max(12px,env(safe-area-inset-top,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
  .nav{bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  .fab{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .f-actpill{bottom:calc(24px + env(safe-area-inset-bottom,0px))}
  .sheet{padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}
  .tl-bar{top:0}
  .stoast{top:calc(8px + env(safe-area-inset-top,0px))}
}
.acc-h .peek{display:none!important}
.acc-add{transition:opacity var(--d-base) var(--ease),transform var(--d-base) var(--ease)}
.acc.open .acc-add{opacity:0;transform:scale(.8);pointer-events:none}

/* ===== ROUND 7 · suggestion card: small emoji, one-line title, iOS text sizes (Subheadline 15 / Footnote 13) ===== */
.tipcard,.tipcard.mira,.tipcard.app,.tipcard.pro{padding:14px 48px 14px 16px;gap:12px;border-radius:22px}
.tipcard-i{width:32px;height:32px;font-size:22px;line-height:32px;color:inherit}
.tipcard-b{flex:1;min-width:0}
.tipcard-t{font:600 15px/20px var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tipcard-s{font:400 13px/18px var(--sans);margin-top:2px}
.tipcard-x{top:50%;transform:translateY(-50%);right:12px;width:26px;height:26px}
.tipcard-x .mi{width:16px;height:16px}

/* =====================================================================
   ACCESSIBILITY PASS (WCAG 2.2 AA) · text ≥ 4.5:1, icons/graphics ≥ 3:1
   card separation like Tiimo: white card + 1px hairline + soft shadow
   ===================================================================== */
:root{--muted:#6c6a72;--faint:#6c6a72;--purple:#6c50e0;--purple-deep:#5a3fd0;--accent:#6c50e0;--accent-deep:#5a3fd0;--green:#11845f}
/* secondary text */
.f-lbl,.f-act-m,.f-art-o,.f-coll-l span,.f-search span,.addrow,.task .meta,.task.isdone .ttl,.strip2 .l,.sec-h .s,.small.muted,.muted{color:#6c6a72}
.tipcard-s{color:#62616a}
.nav .it{color:#6c6a72}.nav .it.on{color:#5a3fd0}
.strip2 .today .n{box-shadow:inset 0 0 0 1.5px #5a3fd0;color:#5a3fd0}
.coach{color:#5a3fd0}
/* data + badges */
.f-badge{background:#0f7f5b}
.f-gbar i{background:#11845f}
.f-bar i,.bar i{background:#6c50e0}
/* icons */
.addrow .mi{color:#86848c}
.acc-add{color:#77757c}
.tl-bar.compact .plusbtn{background:#6c50e0;box-shadow:0 6px 16px rgba(108,80,224,.35)}
/* Mira: white face stays ≥ 3:1 across the whole gradient */
.mira-btn{background:linear-gradient(140deg,#7b5cf0 0%,#8a6ff5 40%,#957cf4 70%,#7f63f1 100%);background-size:260% 260%}
svg.face{filter:drop-shadow(0 1px 1.5px rgba(40,20,110,.35))}
/* cards: Tiimo-style hairline so white cards read on the light page */
.task,.f-card,.f-act,.f-art,.sugg,.card,.f-q-c{box-shadow:0 0 0 1px #ececee,0 2px 12px rgba(0,0,0,.04)}
.card.tint,.card.soft{box-shadow:none}
/* focus visible for keyboard / switch control */
.task:focus-visible,.tipcard:focus-visible,.acc-h:focus-visible,.ib:focus-visible,.nav .it:focus-visible{outline:2px solid #5a3fd0;outline-offset:2px}
.menu div.danger,.actbar .danger,.btn.danger{color:#b3322d}
.cfav.on{color:#c73a35}
.strip2 .sel .n,.strip2 .today.sel .n{background:var(--ink);color:#fff;box-shadow:none}

/* ===== Task action sheet (Tiimo) ===== */
#tsheet:empty{display:none}
.ts-scrim{position:absolute;inset:0;background:rgba(40,40,44,.22);-webkit-backdrop-filter:blur(1.5px);backdrop-filter:blur(1.5px);z-index:20;animation:tsFade var(--d-base) var(--ease)}
.ts{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:#f2f2f3;border-radius:38px;padding:14px 0 12px;z-index:21;box-shadow:0 10px 40px rgba(0,0,0,.18);animation:tsUp var(--d-slow) var(--ease)}
.ts-row{display:flex;align-items:center;gap:18px;min-height:56px;padding:0 36px;font:400 17px/22px var(--sans);color:#1d1b20;cursor:pointer}
.ts-row:active{background:rgba(0,0,0,.04)}
.ts-ic{flex:none;color:#1d1b20}
.ts-ic.ai{color:#6c50e0}
.ts-row.danger,.ts-ic.danger{color:#c42d28}
@keyframes tsUp{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes tsFade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.ts,.ts-scrim{animation:none}}
.task:focus-visible{outline:2px solid #5a3fd0;outline-offset:2px}

/* =====================================================================
   SHEETS & MENUS · one system
   action sheet (.ts) = every menu · content sheet (.sheet) = every form
   type: title 17/600 · row 17/400 · value 15/500 · section 13/600 caps · button 17/600
   ===================================================================== */
.scrim,.ts-scrim{position:absolute;inset:0;background:rgba(40,40,44,.22);-webkit-backdrop-filter:blur(1.5px);backdrop-filter:blur(1.5px);z-index:6;animation:tsFade var(--d-base) var(--ease)}
.ts-scrim{z-index:20}
.sheet{left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-height:88%;border-radius:38px;background:#f2f2f3;padding:8px 16px 20px;box-shadow:0 10px 40px rgba(0,0,0,.18);animation:tsUp var(--d-slow) var(--ease)}
.sheet .handle{display:none}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:60px;margin:0 0 8px}
.sh-title{flex:1;text-align:center;font:600 17px/22px var(--sans);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.ib-primary{background:#1d1b20!important;color:#fff!important}
.sheet .card{background:#fff;border-radius:20px;padding:0 16px;margin:0 0 12px;box-shadow:none}
.sh-row,.sheet .kv,.fs-row{display:flex;align-items:center;gap:12px;min-height:52px;padding:0;border-bottom:1px solid #ececee;font:400 17px/22px var(--sans);color:var(--ink);cursor:pointer}
.sh-row:last-child,.sheet .kv:last-child,.fs-row:last-child{border-bottom:0}
.sh-lbl{flex:1;min-width:0}
.sh-val,.sheet .kv .v{font:500 15px/20px var(--sans);color:var(--ink);background:#f2f2f3;border-radius:999px;padding:6px 12px;white-space:nowrap}
.sh-ico{width:28px;text-align:center;font-size:20px;flex:none}
.sh-row .mi{color:#86848c}
.sh-name .sh-lbl{font-weight:600}
.sh-done{text-decoration:line-through;color:#6c6a72}
.sh-add{color:#6c6a72}
.sh-two{flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;padding:10px 0}
.sh-sub{font:400 13px/18px var(--sans);color:#6c6a72}
.sh-sec,.fs-lbl{display:flex;align-items:center;justify-content:space-between;margin:20px 4px 8px;font:600 13px/18px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:#6c6a72}

.sh-note{padding:14px 16px!important;font:400 15px/21px var(--sans);color:var(--ink)}
.sh-ph{color:#6c6a72;min-height:72px}
.sh-cal{padding:8px 8px!important}
.sheet .check{width:22px;height:22px;flex:none}
.sheet .field{background:#fff;border-radius:20px;box-shadow:none;padding:14px 16px;margin:0 0 12px;font:400 17px/22px var(--sans)}

/* buttons: same everywhere */
.btn{height:52px;padding:0 24px;font:600 17px/22px var(--sans);margin-top:12px}
.btn.sm{height:44px;padding:0 18px;font:600 15px/20px var(--sans)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:none}
.sheet .btn.ghost{background:#fff}
.sheet .btn{margin-top:8px}
/* action sheet rows match content rows */
.ts{left:10px;right:10px}
.ts-row{min-height:56px;font:400 17px/22px var(--sans)}

/* ===== Mira tip · one look everywhere (from the Planning card) ===== */
.mira-tip,.card.tint.mira-tip,.sheet .card.mira-tip,.tipcard.mira-tip{background:#efe6ff!important;border:1px solid #d9cdfb!important;box-shadow:none!important;color:#3b2a7e!important}

/* ===== Add task: quick add + drawer ===== */

.qa-scrim{position:absolute;inset:0;background:rgba(40,40,44,.22);-webkit-backdrop-filter:blur(1.5px);backdrop-filter:blur(1.5px);z-index:30;animation:tsFade var(--d-base) var(--ease)}

.qa-pill{height:34px;padding:0 12px;font-size:12px;letter-spacing:.04em;flex:none}

/* =====================================================================
   MOTION · inspired by 60fps.design (spring physics, bottom sheets, success state, toast, morph)
   one spring for things that arrive, one quick ease for things that leave
   ===================================================================== */
:root{--spring:cubic-bezier(.32,1.28,.58,1);--spring-soft:cubic-bezier(.25,1.12,.5,1);--exit:cubic-bezier(.4,0,1,1);--d-in:420ms;--d-out:220ms}

/* sheets arrive with a spring, leave quickly */
.qa,.ts{animation:sheetIn var(--d-in) var(--spring) both}
.sheet,.sheet.qa-full{animation:sheetIn var(--d-in) var(--spring-soft) both}
.qa.out,.ts.out,.sheet.out{animation:sheetOut var(--d-out) var(--exit) both}
.qa-scrim,.ts-scrim,.scrim{animation:fadeIn 240ms ease both}
.qa-scrim.out,.ts-scrim.out{animation:fadeOut var(--d-out) ease both}
@keyframes sheetIn{from{transform:translateY(110%)}to{transform:none}}
@keyframes sheetOut{to{transform:translateY(110%)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
/* rows inside the menu cascade in */
.ts .ts-row{animation:rowIn 360ms var(--spring-soft) both}
.ts .ts-row:nth-child(2){animation-delay:20ms}.ts .ts-row:nth-child(3){animation-delay:40ms}.ts .ts-row:nth-child(4){animation-delay:60ms}.ts .ts-row:nth-child(5){animation-delay:80ms}.ts .ts-row:nth-child(6){animation-delay:100ms}.ts .ts-row:nth-child(7){animation-delay:120ms}.ts .ts-row:nth-child(8){animation-delay:140ms}
@keyframes rowIn{from{opacity:0;transform:translateY(10px)}}
/* group list opens like a small sheet */
.qa-pick:not([hidden]){animation:pickIn 320ms var(--spring-soft) both;transform-origin:bottom center}
@keyframes pickIn{from{opacity:0;transform:translateY(8px) scale(.98)}}
/* ✨ and the send button wake up as soon as you type */
.qa-ai:not([hidden]){animation:popIn 380ms var(--spring) both}
.qa-ai{font-size:20px;line-height:1;background:#efe6ff;color:inherit}
.qa-send{transition:background 180ms ease,transform 260ms var(--spring)}
.qa-send.is-off{transform:scale(.9)}
.qa-send:not(.is-off){transform:scale(1)}
.qa-send.sent{background:#11845f;animation:morph 320ms var(--spring) both}
@keyframes morph{0%{transform:scale(1) rotate(0)}40%{transform:scale(.82) rotate(-12deg)}100%{transform:scale(1.06) rotate(0)}}
@keyframes popIn{from{opacity:0;transform:scale(.5)}}
/* press feedback everywhere */
.btn,.ib,.qa-pill,.qa-opt,.chip,.task,.tipcard,.acc-add,.sug2,.f-q,.f-grey,.ts-row,.sh-row,.nav .it{transition:transform 160ms var(--spring),background-color 160ms ease}
.btn:active,.ib:active,.qa-pill:active,.qa-send:active,.chip:active,.acc-add:active,.f-q:active,.f-grey:active,.nav .it:active{transform:scale(.94)}
.task:active,.tipcard:active,.sh-row:active,.ts-row:active{transform:scale(.985)}
/* new task slides into its list */
.task.flash{animation:taskIn 560ms var(--spring-soft) both}
@keyframes taskIn{0%{opacity:0;transform:translateY(-10px) scale(.97);box-shadow:0 0 0 2px #c9b8fb}60%{opacity:1;box-shadow:0 0 0 2px #c9b8fb}100%{transform:none}}

.check.pop{animation:checkPop 420ms var(--spring) both}
@keyframes checkPop{0%{transform:scale(.6)}100%{transform:scale(1)}}
/* accordion: spring the chevron, ease the height */
.acc-b{transition:grid-template-rows 320ms cubic-bezier(.2,.8,.2,1)}

/* success toast: dark pill, check draws itself */
.stoast{position:absolute;left:50%;top:52px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;max-width:calc(100% - 40px);background:#1d1b20;color:#fff;border-radius:999px;padding:10px 18px 10px 10px;box-shadow:0 12px 30px rgba(0,0,0,.25);z-index:40;animation:toastIn 520ms var(--spring) both}

/* Mira orb · rebuilt from Mira.png: gradient sampled pixel by pixel, same arc eyes + wide smile.
   Motion uses transform and opacity only (60fps), eases in and out, never snaps. */
.mira-btn,.avatar{position:relative;overflow:hidden;border-radius:50%;isolation:isolate;background:#af9cfa!important;animation:none!important;filter:none!important}
.mira-btn::after{display:none!important}
.mira-btn{width:56px;height:56px;box-shadow:0 8px 22px rgba(140,112,250,.36)!important}
.avatar{box-shadow:0 12px 30px rgba(140,112,250,.30)}
.mb-bg{position:absolute;inset:-21%;border-radius:50%;background:linear-gradient(147deg,#9c83ff 34.5%,#af9cfa 50%,#dbd3ee 85%);will-change:transform;animation:mbTurn 10s cubic-bezier(.45,0,.55,1) infinite alternate}
.mb-glow{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 60%,rgba(255,255,255,.28),rgba(255,255,255,0) 70%);opacity:0;transition:opacity 480ms cubic-bezier(.45,0,.55,1);pointer-events:none}
.mira-btn.playing .mb-glow{opacity:1}
.mface{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.mface path{fill:none;stroke:#fff;stroke-linecap:round;stroke-linejoin:round}
.mface .mf-eye{stroke-width:2.1}
.mface .mf-mouth{stroke-width:2.4}
.mface g{transform-box:fill-box;transform-origin:50% 50%}
.mface .mf-look{animation:mfLook 9s cubic-bezier(.45,0,.55,1) infinite}
.mface .mf-eyes{transform-origin:50% 100%;animation:mfBlink 5.2s cubic-bezier(.45,0,.55,1) infinite}
.mface .mf-smile{transform-origin:50% 0%;animation:mfSmile 4.6s cubic-bezier(.45,0,.55,1) infinite}
.mface .mf-talk{transform-origin:50% 0%}
.mira-btn.playing .mf-talk{animation:mfTalk .52s cubic-bezier(.45,0,.55,1) infinite}
.mira-btn.playing .mf-hop{animation:mfHop .52s cubic-bezier(.45,0,.55,1) infinite}
.fab .mira-btn{animation:mbFloat 4.6s cubic-bezier(.45,0,.55,1) infinite!important;transition:scale 160ms var(--spring)}
.fab:active .mira-btn{scale:.94}
@keyframes mbTurn{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
@keyframes mbFloat{0%,100%{translate:0 0}50%{translate:0 -3px}}
@keyframes mfLook{0%,14%{transform:translate(0,0)}22%,36%{transform:translate(-1.6px,-.5px)}46%,60%{transform:translate(1.6px,-.5px)}70%,100%{transform:translate(0,0)}}
@keyframes mfBlink{0%,88%,100%{transform:scaleY(1)}90.5%{transform:scaleY(.12)}93%{transform:scaleY(1)}}
@keyframes mfSmile{0%,100%{transform:scale(1,1)}50%{transform:scale(1.04,1.1)}}
@keyframes mfTalk{0%,100%{transform:scale(1,1)}45%{transform:scale(.92,1.32)}}
@keyframes mfHop{0%,100%{transform:translateY(0)}45%{transform:translateY(-1.2px)}}
@media (prefers-reduced-motion:reduce){.mb-bg,.mface g,.fab .mira-btn{animation:none!important}.mb-glow{transition:none}}

/* type: matched to Tiimo (measured on the 3x screenshot: title ≈32, list row ≈14–15, pill 12, meta 13) */
.tl-head .day{font-size:32px;line-height:38px}

.addrow{font-size:15px}

/* ===== ROUND 20 · drag & drop · done flow · confetti · in-place filter ===== */
.screen.same > .sheet,.screen.same > .scrim,.screen.same .tipcard{animation:none!important}
.fs-box,.fs-radio{transition:background-color 160ms ease,border-color 160ms ease,border-width 220ms var(--spring)}
.fs-box.pop,.fs-radio.pop{animation:fsPop 340ms var(--spring)}
@keyframes fsPop{0%{transform:scale(.72)}55%{transform:scale(1.14)}100%{transform:scale(1)}}
.acc .task{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.drag-ghost{position:fixed!important;margin:0!important;z-index:9999;pointer-events:none;box-sizing:border-box;background:#fff;color:var(--ink);font-family:var(--sans);box-shadow:0 18px 40px rgba(20,14,48,.22),0 0 0 1px rgba(0,0,0,.04)!important;transition:scale 200ms var(--spring),rotate 200ms var(--spring),opacity 200ms ease;will-change:translate}
.drag-ghost.lift{scale:1.04;rotate:-1.5deg}
.drag-ghost.back{transition:translate 240ms var(--spring),scale 240ms var(--spring),rotate 240ms var(--spring);scale:1;rotate:0deg}
.drag-ghost.drop-out{transition:translate 200ms cubic-bezier(.45,0,.55,1),scale 200ms ease,opacity 200ms ease;scale:.4;opacity:0}
.task.drag-src{opacity:.3;transition:opacity 160ms ease}
body.dnd,body.dnd *{cursor:grabbing!important}
.screen.dnd-on .acc{border-radius:20px;transition:background-color 160ms ease,box-shadow 160ms ease}
.acc.drop{background:rgba(108,80,224,.07);box-shadow:0 0 0 2px rgba(108,80,224,.38)}
.acc-h .lab{transition:scale 220ms var(--spring)}
.acc.drop .acc-h .lab{scale:1.08}
.acc-h .lab.bump{animation:labBump 560ms var(--spring)}
@keyframes labBump{0%{scale:1}40%{scale:1.16}100%{scale:1}}
.cf{position:fixed;z-index:10000;pointer-events:none;will-change:transform,opacity}
.stoast-a{flex:none;margin-left:4px;padding:6px 2px 6px 12px;border-left:1px solid rgba(255,255,255,.2);font:600 15px/20px var(--sans);color:#c9b8fb;cursor:pointer;pointer-events:auto;white-space:nowrap}
.stoast{pointer-events:auto;width:max-content;max-width:calc(100% - 32px)}
.stoast-t b,.stoast-t span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (prefers-reduced-motion:reduce){.drag-ghost,.fs-box,.fs-radio,.acc-h .lab{transition:none!important;animation:none!important}}

/* ===== ROUND 21 · trophy notifications · Tiimo check · Tiimo drag · confetti ===== */
@media (max-width:540px){html,body{margin:0}}
/* notification card: full width inside the margins, light glass, serif title, progress, glossy badge */
.nt{position:absolute;left:12px;right:12px;top:52px;z-index:60;display:flex;align-items:center;gap:16px;padding:22px 18px 22px 24px;border-radius:36px;background:rgba(245,244,247,.93);-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);box-shadow:0 20px 44px rgba(20,14,48,.16),0 0 0 .5px rgba(0,0,0,.06),inset 0 1px 0 rgba(255,255,255,.95);color:#1d1b20;touch-action:none;cursor:pointer;animation:ntIn 560ms cubic-bezier(.2,.9,.3,1.12) both;transition:transform 260ms cubic-bezier(.2,.9,.3,1.12)}
.nt.out{animation:ntOut 240ms cubic-bezier(.4,0,1,1) both}
@keyframes ntIn{0%{opacity:0;transform:translateY(-30px) scale(.94)}100%{opacity:1;transform:none}}
@keyframes ntOut{to{opacity:0;transform:translateY(-22px) scale(.96)}}
.nt-error{background:rgba(255,245,244,.95)}
.nt-danger{background:rgba(255,247,239,.95)}
.nt-txt{flex:1;min-width:0}
.nt-t{font:400 24px/28px var(--display);letter-spacing:-.01em;color:#1d1b20}
.nt-s{font:400 15px/20px var(--sans);color:#4a4850;margin-top:4px}
.nt-bar{height:8px;border-radius:4px;background:rgba(29,27,32,.1);margin-top:14px;overflow:hidden}
.nt-bar i{display:block;height:100%;border-radius:4px;background:#2b2930;transition:width 760ms cubic-bezier(.3,.7,.2,1)}
.nt-a{display:inline-flex;align-items:center;min-height:32px;margin-top:8px;font:600 15px/20px var(--sans);color:#5a3fd0;cursor:pointer}
.nt-badge{flex:none;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:76px}
.nt-orb{position:relative;width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:inset -6px -9px 16px rgba(0,0,0,.22),inset 5px 7px 14px rgba(255,255,255,.32),0 10px 22px rgba(20,14,48,.18);animation:orbIn 760ms cubic-bezier(.34,1.56,.64,1) 120ms both}
.nt-trophy .nt-orb{width:76px;height:76px}
.nt-orb::after{content:"";position:absolute;left:15%;top:9%;width:48%;height:32%;border-radius:50%;background:radial-gradient(ellipse at center,rgba(255,255,255,.75),rgba(255,255,255,0) 70%);transform:rotate(-22deg);pointer-events:none}
.nt-orb svg{position:relative;z-index:1;width:32px;height:32px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.nt-orb svg path{stroke-dasharray:44;stroke-dashoffset:44;animation:ntDraw 460ms ease-out 480ms forwards}
@keyframes ntDraw{to{stroke-dashoffset:0}}
@keyframes orbIn{0%{transform:scale(.3) rotate(-28deg);opacity:0}100%{transform:none;opacity:1}}
.nt-orb.mira-orb{background:#af9cfa;overflow:hidden;box-shadow:0 10px 22px rgba(140,112,250,.3)}
.nt-orb.mira-orb::after{display:none}
.nt-name{font:600 11px/14px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:#3b3940;white-space:nowrap}
.tr-1{background:radial-gradient(circle at 32% 28%,#b4adff 0%,#5d4ef2 40%,#3a24c9 72%,#23128c 100%)}
.tr-2{background:radial-gradient(circle at 32% 28%,#ffd6e6 0%,#f27aa8 42%,#d2457e 72%,#9a2357 100%)}
.tr-3{background:radial-gradient(circle at 32% 28%,#c9f6e7 0%,#45c9a2 42%,#169b74 72%,#0b6b4f 100%)}
.tr-4{background:radial-gradient(circle at 32% 28%,#fff2c8 0%,#f6c04a 42%,#dc9612 72%,#9a6106 100%)}
.o-success{background:radial-gradient(circle at 32% 28%,#cdf2e1 0%,#36b686 45%,#11845f 78%,#0a5e43 100%)}
.o-error{background:radial-gradient(circle at 32% 28%,#ffd7d3 0%,#f0645a 45%,#c42d28 78%,#8f1c18 100%)}
.o-danger{background:radial-gradient(circle at 32% 28%,#ffe3c4 0%,#f7a24a 45%,#d9731a 78%,#9c4c0a 100%)}
@media (max-width:540px){.nt{top:calc(env(safe-area-inset-top,0px) + 8px)}}
@media (prefers-reduced-motion:reduce){.nt,.nt.out,.nt-orb,.nt-orb svg path{animation:none!important;stroke-dashoffset:0}.nt-bar i{transition:none}}

/* check (Tiimo): ink fill + white tick that draws; the row holds, then fades and closes */
.check.on{background:#1d1b20!important;border-color:#1d1b20!important}
.check svg{width:15px;height:15px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.check.pop svg path{stroke-dasharray:22;stroke-dashoffset:22;animation:ntDraw 280ms ease-out 90ms forwards}
.check.pop{animation:chkPop 420ms cubic-bezier(.34,1.56,.64,1) both}
@keyframes chkPop{0%{transform:scale(.7)}55%{transform:scale(1.12)}100%{transform:scale(1)}}
.task.checking .ttl{text-decoration:none!important;color:var(--ink)!important}

/* confetti layer lives inside the phone */
.cf-box{position:absolute;inset:0;z-index:55;pointer-events:none;overflow:hidden;perspective:600px}
.cf{position:absolute;left:0;top:0;display:block;will-change:transform,opacity;background:var(--c)}
.cf-dot{border-radius:50%}
.cf-flake{border-radius:2px}
.cf-curl{background:none;border:2.6px solid var(--c);border-color:var(--c) transparent transparent transparent;border-radius:50%}

/* drag (Tiimo): no purple; card lifts, shrinks to a chip; grey slot opens in the target group */
.acc.drop{background:none!important;box-shadow:none!important}
.acc.drop .acc-h .lab{scale:1}
.screen.dnd-on .acc{border-radius:0}
.task.pressing{scale:.98;transition:scale 300ms cubic-bezier(.45,0,.55,1)}
.task.drag-src{opacity:.45}
.drag-ghost{transition:scale 220ms cubic-bezier(.34,1.4,.64,1),rotate 220ms ease,box-shadow 220ms ease,opacity 200ms ease!important}
.drag-ghost.lift{scale:1.03;rotate:0deg;box-shadow:0 16px 36px rgba(20,14,48,.18)!important}
.drag-ghost.mini{scale:.56;rotate:-2deg;box-shadow:0 10px 24px rgba(20,14,48,.2)!important}
.drag-ghost.land{transition:translate 260ms cubic-bezier(.34,1.3,.64,1),scale 260ms cubic-bezier(.34,1.3,.64,1),rotate 200ms ease!important;scale:1;rotate:0deg}
.drag-ghost.back{transition:translate 280ms cubic-bezier(.34,1.3,.64,1),scale 280ms cubic-bezier(.34,1.3,.64,1),rotate 200ms ease!important;scale:1;rotate:0deg}
.drop-slot{height:0;margin:0;border-radius:12px;background:#ececee;opacity:0;transition:height 220ms cubic-bezier(.34,1.2,.64,1),margin 220ms cubic-bezier(.34,1.2,.64,1),opacity 160ms ease}
.acc.drop .drop-slot{height:52px;margin:10px 0 4px;opacity:1}
@media (prefers-reduced-motion:reduce){.drop-slot,.drag-ghost,.task.pressing{transition:none!important}}

/* ===== ROUND 22 · FLAT DESIGN — the reference for the whole app =====
   No drop shadows, no 3D/radial gradients, no inner highlights or glows.
   Depth comes from colour and 1px hairlines only. Exceptions: the Mira orb's own gradient (brand asset)
   and the frosted blur on the nav / scrolled top bar (no shadow on them). */
:root{--shadow:none;--e1:inset 0 0 0 1px #e3e2e7;--hair:#e3e2e7}
.ib,.pillbtn,.grid4 .m .ic{box-shadow:inset 0 0 0 1px #e3e2e7}
/* hairlines are drawn INSIDE the box (inset) so a parent with overflow:hidden (open groups) can never clip the left/right edge */
.card,.task,.f-card,.f-act,.f-art,.sugg,.f-q-c,.ctile,.vd-act,.vd-list,.sug2{box-shadow:inset 0 0 0 1px #e3e2e7}
.nav{box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.nav::before{display:none}
.mira-btn,.mira-btn.playing,.avatar,.fab .mira-btn{box-shadow:none!important}
.mb-glow{display:none}
svg.face{filter:none}
.sheet,.ts,.qa,.menu,.ask,.actbar,.stoast{box-shadow:none}
.actpill,.f-actpill{box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.tl-bar.compact .plusbtn{box-shadow:none}
.tl-bar.compact{box-shadow:0 1px 0 #e6e5e8}
.vd-seg span.on{box-shadow:0 0 0 1px #e3e2e6}
.hero,.illus{background:#efe6ff}
.drag-ghost,.drag-ghost.lift,.drag-ghost.mini{box-shadow:inset 0 0 0 1px #d6d5db!important}
/* messages: flat card, flat solid badges */
.nt{background:#f3f2f5;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:0 0 0 1px #e6e5e9}
.nt-error{background:#fdf0ef;box-shadow:0 0 0 1px #f4d6d3}
.nt-danger{background:#fdf3ea;box-shadow:0 0 0 1px #f2dcc6}
.nt-orb,.nt-orb.mira-orb{box-shadow:none}
.nt-orb::after{display:none}
.nt-orb svg{filter:none}
.tr-1{background:#5b45e0}
.tr-2{background:#c93f77}
.tr-3{background:#11845f}
.tr-4{background:#b86e00}
.o-success{background:#11845f}
.o-error{background:#c42d28}
.o-danger{background:#c4610f}
.nt-orb svg.mface{width:100%;height:100%}
.nt-orb svg.mface path{stroke-dasharray:none;stroke-dashoffset:0;animation:none}
/* confetti stays flat: 2D spin only */
.cf-box{perspective:none}

/* ===== ROUND 24 · ONE SPACING SYSTEM FOR EVERY SCREEN (scale 8 · 16 · 32 · 48) =====
   8   row ↔ row in a list (task cards, add rows, cards, activity) · title → subtitle · button ↔ button
   0   rows inside a divided list (key/value rows, sheet rows): the 1px line separates them
   16  section title → its first item · subtitle/paragraph → content · chips/filters → content · content → main button
   32  page section label (small caps) above a list
   48  end of a section → next section title
   Margins collapse, so each element only declares its own space. */
#screen .task,#screen .addrow,#screen .card,#screen .f-card,#screen .f-act,#screen .vd-list,#screen .tipcard,#screen .f-art{margin-top:0;margin-bottom:8px}
#screen .kv,#screen .sh-row{margin-top:0;margin-bottom:0}
#screen > h2{margin-bottom:16px}
#screen > h2 + p{margin-top:-8px}
#screen > p{margin-top:0;margin-bottom:16px}
#screen > h3,#screen .f-h,#screen > .sec-h,#screen .f-sec{margin-top:48px;margin-bottom:16px}
#screen > .sh-sec{margin:32px 4px 8px}
#screen > .hrow,#screen > .chipgrid{margin-top:0;margin-bottom:16px}
#screen > .btn{margin-top:16px;margin-bottom:8px}
#screen > .btn + .btn{margin-top:0}
/* ===== ROUND 24 · spacing rules for grouped lists — one rhythm in every state (8 · 16 · 32) =====
   8   inside a group: pill → first row, row → row, grey drop slot → row
   16  between groups when the group above is closed
   32  between groups when the group above is open, and from the suggestion card to the first group */
.acc-h .lab{margin:0!important;justify-content:flex-start}   /* the old `.week` strip class no longer leaks margin into the pill */
.acc-row{height:32px;min-height:32px}
.acc-h{min-height:32px!important;height:32px;position:relative}
.acc-add{position:relative}
.acc-h::after{content:"";position:absolute;left:0;right:0;top:-6px;bottom:-6px}   /* 44px touch target, no layout change */
.acc-add::after{content:"";position:absolute;inset:-6px}
#screen .acc{margin:0}
#screen .acc + .acc,#screen .acc + .coach + .acc{margin-top:16px}
#screen .acc.open + .acc,#screen .acc.open + .coach + .acc{margin-top:32px}
#screen .acc-b>div{padding:0}
#screen .acc-b>div>*{margin:0 0 8px}
#screen .acc-b>div>*:first-child{margin-top:8px}
#screen .acc-b>div>*:last-child{margin-bottom:0}
#screen .acc.drop .drop-slot{margin:8px 0 0;height:52px}
#screen .tiprow{margin:24px 0 32px}
#screen .tiprow:empty{display:block;margin:0;height:32px}

/* ===== ROUND 25 · message card = Tiimo trophy card (measured on the 3x screenshot), flat =====
   card: 12 margins · radius 28 · light grey fill + 1.5px white stroke + hairline · title 22 serif · text 15 · bar 6 · emoji badge 64 */
.nt{left:12px;right:12px;gap:12px;padding:22px 20px 18px 22px;border-radius:28px;background:#f2f2f3;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.07);align-items:center}
.nt-error{background:#fbefee;box-shadow:0 0 0 1px #f1d5d2}
.nt-danger{background:#fbf2ea;box-shadow:0 0 0 1px #efdac6}
.nt-t{font:400 22px/26px var(--display);letter-spacing:-.005em}
.nt-s{font:400 15px/20px var(--sans);color:#4a4850;margin-top:4px;text-wrap:pretty}
.nt-t{text-wrap:balance}
.nt-foot{display:flex;align-items:center;gap:14px;margin-top:14px}
.nt-foot .nt-bar{flex:1;height:6px;border-radius:3px;margin:0;background:rgba(29,27,32,.10)}
.nt-foot .nt-bar i{border-radius:3px;background:#3a393d}
.nt-foot .nt-a{margin:0;min-height:28px;flex:none}
.nt-badge{min-width:0;width:64px;gap:0}
.nt-emo{width:64px;height:64px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 1px #e6e5e9;display:flex;align-items:center;justify-content:center;font-size:34px;line-height:1;animation:emoIn 640ms cubic-bezier(.34,1.56,.64,1) 100ms both}
.nt-success .nt-emo{animation:emoIn 640ms cubic-bezier(.34,1.56,.64,1) 100ms both,emoWiggle 900ms cubic-bezier(.45,0,.55,1) 760ms 1}
@keyframes emoIn{0%{opacity:0;transform:scale(.4) rotate(-18deg)}100%{opacity:1;transform:none}}
@keyframes emoWiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}55%{transform:rotate(8deg)}80%{transform:rotate(-3deg)}}
@media (prefers-reduced-motion:reduce){.nt-emo,.nt-success .nt-emo{animation:none!important}}

/* ===== ROUND 26 · undo = round icon button, same style as the page's icon buttons (.ib) ===== */
.nt-foot{margin-top:14px}
.nt > .nt-ib{align-self:center}
.nt-ib{width:40px;height:40px;flex:none;background:#fff;color:#1d1b20;box-shadow:inset 0 0 0 1px #e3e2e7;cursor:pointer}
.nt-ib .mi{display:block}

/* ===== ROUND 27 · ONBOARDING · Bogdan's design (measured on the 375×812 exports) =====
   cream #f8f4f0 · gradient cream → lavender #a288fe · titles Canela 34 · text SF Pro · ink buttons #161111 48px
   ONE bottom bar: [optional button above] [MAIN BUTTON — same place, size and colour on every screen] [link slot] */
.inner.obmode .status{background:transparent}
.obx{position:absolute;inset:0;z-index:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;background:#f8f4f0;padding:88px 16px var(--obf-h,154px);color:#1d1b20;font-family:var(--sans)}
.obx::-webkit-scrollbar{display:none}
.obx.grad{background:linear-gradient(180deg,#f7f3f0 0%,#efe9f1 34%,#d5caf4 50%,#bdacf8 62%,#a58ffe 76%,#a288fe 100%)}
.obx.grad2{background:linear-gradient(180deg,#f8f4f0 0%,#f8f4f0 44%,#e8e1f2 56%,#c3b3f8 68%,#a28afe 80%,#a288fe 100%)}
.obx.white{background:#fff}
.obx.mist{background:#fafafa}
.obx.center{display:flex;align-items:center;justify-content:center;padding:0}
.obx.bottom{display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:calc(var(--obf-h,154px) + 8px)}
.ob-t{font:400 34px/34px var(--display);letter-spacing:-.01em;margin:0;color:#1d1b20;text-wrap:balance}
.ob-t.c{text-align:center}
.ob-t-sm{font-size:24px;line-height:30px}
.obx .ob-s{font:400 13px/17px var(--sans);color:#6f6c6a;margin:10px 0 0}
.obx .ob-lead{font:400 19px/27px var(--display);color:#1d1b20;text-align:center;margin:20px 8px 0;text-wrap:balance}
/* range pills (guests, budget) */

/* publish (per event) */

/* guest wedding page */
.obx.gs{background:var(--iv-bg);color:var(--iv-ink);padding:0 20px 48px;overflow-x:hidden}
.gs-url{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:8px;margin:0 -20px;padding:52px 16px 10px;background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 -1px 0 rgba(0,0,0,.06);font:500 13px/16px var(--sans);color:#3d3a44}
.gs-url span{display:inline-flex;align-items:center;gap:4px;flex:1;justify-content:center}
.gs-url em{font-style:normal;font-size:11px;padding:2px 8px;border-radius:999px;background:#f2f1f4;color:#6c6a72}
.gs-url em:empty{display:none}
.gs-urlx{width:32px;height:32px;border:0;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 1px #e3e2e7;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#161111}
.gs-petals{position:absolute;inset:0;height:760px;overflow:hidden;pointer-events:none;z-index:0}
.gs-petals i{position:absolute;top:-24px;width:10px;height:14px;border-radius:60% 0 60% 0;background:color-mix(in srgb,var(--iv-acc) 45%,#fff);opacity:.8;animation:gsFall linear infinite}
@keyframes gsFall{0%{transform:translate(0,-20px) rotate(0)}50%{transform:translate(24px,380px) rotate(160deg)}100%{transform:translate(-12px,780px) rotate(320deg);opacity:0}}
.gs-hero{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center;padding:72px 0 16px}
.gs-k{font:500 12px/16px var(--sans);letter-spacing:.14em;text-transform:uppercase;opacity:.8;animation:gsUp 700ms 100ms cubic-bezier(.2,.8,.2,1) both}
.gs-n{margin:16px 0 0;font:400 48px/52px var(--display);text-wrap:balance;animation:gsUp 800ms 250ms cubic-bezier(.2,.8,.2,1) both}
.gs-d{margin-top:12px;font:400 20px/26px var(--display);animation:gsUp 800ms 400ms cubic-bezier(.2,.8,.2,1) both}
@keyframes gsUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.gs-count{display:grid;grid-template-columns:repeat(3,80px);gap:8px;margin-top:32px;animation:gsUp 800ms 550ms cubic-bezier(.2,.8,.2,1) both}
.gs-count div{display:flex;flex-direction:column;align-items:center;padding:12px 0;border-radius:16px;background:rgba(255,255,255,.7);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}

.gs-count span{font:400 12px/16px var(--sans);opacity:.75}
.gs-jump{margin-top:32px;display:inline-flex;align-items:center;height:48px;padding:0 28px;border-radius:999px;background:var(--iv-ink);color:#fff;font:600 16px/20px var(--sans);text-decoration:none;animation:gsUp 800ms 700ms cubic-bezier(.2,.8,.2,1) both}
.gs-sec{position:relative;z-index:1;margin-top:48px}
.gs-rv{opacity:0;transform:translateY(24px);transition:opacity 600ms ease,transform 700ms cubic-bezier(.2,.8,.2,1)}

.gs-story{margin:0;text-align:center;font:400 22px/30px var(--display);text-wrap:balance}
.gs-h2{margin:0 0 16px;text-align:center;font:400 32px/38px var(--display)}
.gs-p{margin:0;text-align:center;font:400 16px/22px var(--sans)}
.gs-ev{display:flex;gap:16px;align-items:flex-start;padding:16px;margin-top:8px;border-radius:20px;background:rgba(255,255,255,.75);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.gs-ev-e{flex:none;width:44px;height:44px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:22px}
.gs-ev b{display:block;font:600 16px/22px var(--sans)}
.gs-ev span{display:block;font:400 15px/20px var(--sans);opacity:.85}
.gs-ev a{display:inline-flex;align-items:center;gap:4px;margin-top:8px;font:600 13px/16px var(--sans);color:var(--iv-ink)}
.gs-card{margin-top:16px;padding:20px 16px;border-radius:24px;background:#fff;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);color:#161111}
.gs-lbl{display:block;margin:16px 0 8px;font:500 14px/18px var(--sans);color:#3d3a44}
.gs-card>.gs-lbl:first-child{margin-top:0}
.gs-search{display:flex;gap:8px}
.gs-search input,.gs-in{flex:1;min-width:0;width:100%;height:48px;padding:0 16px;border:0;border-radius:14px;background:#f6f4f8;font:400 16px/22px var(--sans);color:#161111;outline:none;box-sizing:border-box}
textarea.gs-in{height:auto;padding:12px 16px;resize:none}
.gs-search input:focus,.gs-in:focus{box-shadow:inset 0 0 0 2px var(--iv-acc)}
.gs-search .obf-btn{width:auto;padding:0 20px;flex:none}
.gs-err{margin:12px 0 0;font:400 14px/19px var(--sans);color:#c42d28}
.gs-hi{font:400 16px/22px var(--sans)}
.gs-person{margin-top:16px;padding-top:16px;box-shadow:inset 0 1px 0 #ececee}
.gs-person>b{display:block;margin-bottom:8px;font:600 16px/22px var(--sans)}
.gs-seg{margin:0}
.gs-sel{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;font:400 15px/20px var(--sans);color:#3d3a44}
.gs-sel select{height:40px;padding:0 12px;border:0;border-radius:12px;background:#f6f4f8;font:500 15px/20px var(--sans);color:#161111}

.gs-send{margin-top:24px}
.gs-back{display:block;margin:12px auto 0;padding:8px;border:0;background:none;font:500 14px/18px var(--sans);color:#3d3a44;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.gs-thanks{text-align:center}
.gs-thx-e{display:inline-flex;width:64px;height:64px;border-radius:50%;background:#f6f4f8;align-items:center;justify-content:center;font-size:30px}

.gs-thanks p{margin:8px 0 0;font:400 15px/20px var(--sans);color:#3d3a44}
.gs-thanks .pw-restore{display:flex;align-items:center;justify-content:center;gap:6px;width:100%}
.gs-foot{margin:48px 0 0;text-align:center;font:400 13px/18px var(--sans);opacity:.7}
@media (max-width:540px){.gs-url{padding-top:calc(env(safe-area-inset-top,0px) + 8px)}}
/* seating lock */
.st-lock{position:relative}
.st-ghost{filter:blur(3px);opacity:.55;pointer-events:none;user-select:none}
.st-card{position:absolute;left:0;right:0;top:88px;padding:24px 20px;border-radius:24px;background:#fff;box-shadow:inset 0 0 0 1px #e3e2e7;text-align:center}
.st-ic{display:inline-flex;width:48px;height:48px;border-radius:50%;background:#efe6ff;color:#5a3fd0;align-items:center;justify-content:center}

.st-card p{margin:8px 0 0;font:400 15px/21px var(--sans);color:#4b4852}
@media (prefers-reduced-motion:reduce){.gs-petals{display:none}.gs-k,.gs-n,.gs-d,.gs-count,.gs-jump,.ip-card{animation:none}.gs-rv{opacity:1;transform:none;transition:none}}

/* ROUND 35 · smooth reveal (one curve, same duration for fade and move, no scale/spring) */
.rv{opacity:0;transform:translate3d(0,14px,0);will-change:opacity,transform}
.rv.in{opacity:1;transform:none;transition:opacity 600ms cubic-bezier(.22,1,.36,1),transform 600ms cubic-bezier(.22,1,.36,1)}
.f-q.rv{opacity:0;transform:translate3d(0,12px,0)}
.f-q.rv.in{opacity:1;transform:none;transition:opacity 600ms cubic-bezier(.22,1,.36,1),transform 600ms cubic-bezier(.22,1,.36,1)}
.f-q{-webkit-tap-highlight-color:transparent}
.f-q:active{transition:transform 120ms ease-out}

/* ROUND 36 · Hub bar + Add sheet */
.hub-bar .pillbtn{height:40px;display:inline-flex;align-items:center}
.hub-head{margin-bottom:8px}
.hub-add .ha-row{width:100%;border:0;background:none;padding:0;text-align:left;gap:12px;min-height:56px;cursor:pointer;font-family:var(--sans)}

.ha-t b{font:500 16px/21px var(--sans);color:var(--ink)}

.ha-pro{flex:none;padding:3px 8px;border-radius:999px;background:#efe6ff;color:#5a3fd0;font:700 11px/14px var(--sans);letter-spacing:.06em}

.ha-row:active{background:#f6f4f8}

.obx.md{background:linear-gradient(180deg,var(--md-bg) 0%,#f7f6f4 100%);transition:background 500ms ease;padding:0 24px 32px;display:flex;flex-direction:column;align-items:center;text-align:center}

function week(active){const days=lang==='ro'?['L','Ma','Mi','J','V','S','D']:['Mo','Tu','We','Th','Fr','Sa','Su'];return `<div class="week"><span class="arrow">‹</span>${[1,2,3,4,5,6,7].map((d,i)=>`<div class="d ${i===active?'on':''} ${[0,2,4].includes(i)?'dot':''}"><b>${d}</b><span>${days[i]}</span></div>`).join('')}<span class="arrow">›</span></div>`;}
const miraCard=(title,body)=>`<div class="card soft"><div class="row"><span class="small" style="font-weight:700;letter-spacing:.08em;color:var(--accent-deep)">${_('RECOMANDAREA MIREI','MIRA RECOMMENDS')}</span><span class="small muted">1/3 ›</span></div><h3 style="margin:8px 0 4px;font-size:20px">${title}</h3><p style="color:var(--ink)">${body}</p><div class="row"><span class="btn sm ghost" onclick="go('mira')">${_('Întreab-o pe Mira','Ask Mira')} →</span></div></div>`;

/* one bottom bar for every onboarding screen: [optional button above] [MAIN BUTTON, fixed place] [link slot] */
function obScreen(o){
  const above=o.above||'';
  return `<div class="obx ${o.bg||''} ${o.cls||''}" style="--obf-h:${above?218:154}px">${o.body}</div>`+
   (o.primary?`<div class="obf">${above}<button class="obf-btn ink" type="button" onclick="${o.go}">${o.primary}</button><div class="obf-slot">${o.slot||''}</div></div>`:'');
}
const obNext=id=>`haptic('light');go('${id}')`;

/* 3 · date (Material-style picker card from the design) */
const OB_MON=[['ianuarie','January'],['februarie','February'],['martie','March'],['aprilie','April'],['mai','May'],['iunie','June'],['iulie','July'],['august','August'],['septembrie','September'],['octombrie','October'],['noiembrie','November'],['decembrie','December']];
function obCalHtml(){
  const ro=lang==='ro',y=obs.y,m=obs.m,first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
  const lead=ro?(first+6)%7:first,wk=ro?['L','M','M','J','V','S','D']:['S','M','T','W','T','F','S'];
  const sel=obs.dateSet?new Date(y,m,obs.d):null;
  const head=obs.dateSet?(ro?sel.toLocaleDateString('ro-RO',{weekday:'short',day:'numeric',month:'short'}):sel.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})):_('Alege o zi','Pick a day');
  const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
  let cells='';for(let i=0;i<lead;i++)cells+='<span></span>';
  for(let d=1;d<=days;d++){const on=obs.dateSet&&d===obs.d,today=(y===2026&&m===10&&d===9);cells+=`<button type="button" class="obc-d ${on?'on':''} ${today?'today':''}" aria-pressed="${on}" onclick="obCalPick(${d})">${d}</button>`;}
  return `<div class="obc-lbl">${_('Data nunții','Select date')}</div>
<div class="obc-head"><span>${cap(head)}</span></div>
<div class="obc-nav"><span class="obc-month">${cap(_(...OB_MON[m]))} ${y}</span><span class="obc-arr"><button type="button" aria-label="${_('Luna trecută','Previous month')}" onclick="obCalMove(-1)">${mi('chevron_right',22).replace('<svg','<svg style="transform:rotate(180deg)"')}</button><button type="button" aria-label="${_('Luna următoare','Next month')}" onclick="obCalMove(1)">${mi('chevron_right',22)}</button></span></div>
<div class="obc-grid">${wk.map(w=>`<b>${w}</b>`).join('')}${cells}</div>
<div class="obc-act"><button type="button" onclick="obCalClear()">${_('Anulează','Cancel')}</button><button type="button" onclick="${obNext('ob3')}">OK</button></div>`;
}
window.obCalPick=d=>{haptic('select');obs.d=d;obs.dateSet=true;const c=document.getElementById('obCal');if(c)c.innerHTML=obCalHtml();};
window.obCalMove=k=>{haptic('select');obs.m+=k;if(obs.m<0){obs.m=11;obs.y--;}if(obs.m>11){obs.m=0;obs.y++;}const max=new Date(obs.y,obs.m+1,0).getDate();if(obs.d>max)obs.d=max;const c=document.getElementById('obCal');if(c)c.innerHTML=obCalHtml();};
window.obCalClear=()=>{obs.dateSet=false;const c=document.getElementById('obCal');if(c)c.innerHTML=obCalHtml();};
window.obNoDate=()=>{obs.dateSet=false;go('ob3');};

 primary:_('Continuă','Continue'),go:obNext('ob3'),slot:`<span class="ob-link" role="button" tabindex="0" onclick="obNoDate()"><b>${_('Nu m-am decis încă','I haven’t decided yet')}</b></span>`});
N.ob2={t:'Data nunții',m:'design Bogdan · card calendar lavandă',b:'<p>Atingi o zi, săgețile schimbă luna. „Nu m-am decis încă” merge mai departe fără dată. Anulează/OK din card au text închis la culoare ca să se citească pe lavandă.</p>'};

function obPills(group,list,sel){return `<div class="ob-pills" role="radiogroup">${list.map((p,i)=>`<button type="button" role="radio" aria-checked="${sel===i}" class="ob-pill ${sel===i?'on':''}" onclick="obPill('${group}',${i},this)">${_(...p[0])}</button>`).join('')}</div>`;}
window.obPill=(g,i,el)=>{haptic('select');obs[g]=obs[g]===i?-1:i;el.parentNode.querySelectorAll('.ob-pill').forEach((b,k)=>{b.classList.toggle('on',k===obs[g]);b.setAttribute('aria-checked',String(k===obs[g]));});
