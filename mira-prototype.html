const normTxt=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[șş]/g,'s').replace(/[țţ]/g,'t').toLowerCase();
/* verbs (buy, call, book, check) and 'for whom' words (guests, bride) describe the task, the object decides the emoji */
const CAT_W={'🛍️':.45,'📞':.45,'🗓️':.45,'✅':.45,'👥':.55,'👰':.55,'🤵':.8};
function emojiScore(t){
  const n=' '+normTxt(t).replace(/[^a-z0-9€ ]+/g,' ').replace(/\s+/g,' ').trim()+' ';
  const words=n.trim().split(' ').filter(Boolean);
  let best=null,bestScore=0;
  EMO_DB.forEach(([e,bg,stems,phrases],idx)=>{
    let s=0,w0=CAT_W[e]||1;
    for(const p of phrases){const q=' '+normTxt(p)+' ';if(n.includes(q)||n.includes(' '+normTxt(p)))s+=6+p.length;}
    for(const w of words)for(const st of stems){
      if(EMO_EXACT.has(st)){if(w===st)s+=(2+st.length)*w0;}
      else if(st.length>=3&&w.startsWith(st))s+=(2+st.length)*w0;
    }
    if(n.includes('€'))s+=(e==='💶'?6:0);
    if(s>bestScore){bestScore=s;best=[e,bg];}
  });
  return best;
}
const emojiFor=t=>{const r=emojiScore(t);return r?r[0]:'📝';};

    const scored=EMO_DB.map(r=>[r[0],(()=>{let s=0;for(const w of n.trim().split(' '))for(const st of r[2])if(w.startsWith(st)&&st.length>=3||w===st)s+=st.length;for(const p of r[3])if(n.includes(normTxt(p)))s+=10+p.length;return s;})()]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
    out.push(emojiFor(t),...scored.filter(e=>!['🛍️','📞','🗓️','✅'].includes(e)),...scored);
    const words=normTxt(t).split(/[^a-z0-9]+/).filter(w=>w.length>=3);
    EMOJI_ALL.forEach(r=>{const nm=normTxt(r[2]);if(words.some(w=>nm.split(' ').some(x=>x.startsWith(w)||w.startsWith(x)&&x.length>=4)))out.push(r[0]);});
  }
  out.push(...epRecent());
  out.push('💍','👰','🤵','💐','🎂','🥂','💌','📸','🎶','💃','🕯️','🍽️','🏛️','💶','👗','🎁','🚗','✈️','📝','✅');
  return [...new Set(out)].slice(0,48);
}

/* Mira's draft: built only from the couple's own plan data; the user edits and sends it herself */
function vText(){
  const v=vGet(vd.id), ro=lang==='ro', t=vd.tone, it=vd.intent, c=vd.ctx, L=a=>ro?a[0]:a[1];
  const hi=t===1?(ro?`Bună ziua, doamna ${v.person},`:`Dear ${v.person},`):t===2?(ro?`Bună, ${v.person}!`:`Hi ${v.person},`):(ro?`Bună ziua, ${v.person},`:`Hello ${v.person},`);
  const bye=t===1?(ro?'Cu stimă,\nAlecsa Ionescu & Mihai Popa':'Kind regards,\nAlecsa Ionescu & Mihai Popa'):t===2?(ro?'Mulțumim!\nAlecsa & Mihai':'Thanks!\nAlecsa & Mihai'):(ro?'Mulțumim frumos,\nAlecsa & Mihai':'Many thanks,\nAlecsa & Mihai');
  const date=ro?'14 august 2027':'14 August 2027';
  const where=c.venue?(ro?', la Restaurant X din București':', at Restaurant X in Bucharest'):'';
  const facts=[];
  if(c.guests)facts.push(ro?'120 de invitați':'120 guests');
  if(c.vibe)facts.push(ro?'stil clasic, în alb și verde':'classic style, white and green');
  if(c.budget||it===3)facts.push(ro?`buget pentru ${v.cat[0]}: în jur de ${v.bud}`:`budget for ${v.cat[1]}: around ${v.bud}`);
  const att=(vd.att.size||vd.link)?(ro?(vd.att.size?'V-am atașat câteva imagini cu ce ne place'+(vd.link?' și linkul colecției noastre.':'.'):'V-am trimis linkul colecției noastre de inspirație.'):(vd.att.size?'I’ve attached a few pictures of what we like'+(vd.link?' and a link to our collection.':'.'):'Here is a link to our inspiration collection.')):'';
  const intro=c.date?(ro?`Ne căsătorim pe ${date}${where}`:`We’re getting married on ${date}${where}`):(ro?`Ne căsătorim${where}`:`We’re getting married${where}`);
  let subj, lines=[];
  if(it===0){
    subj=ro?`Cerere de ofertă · ${v.cat[0]} nuntă${c.date?' '+date:''}`:`Quote request · wedding ${v.cat[1]}${c.date?' '+date:''}`;
    lines.push(intro+(ro?` și ne-ar plăcea să lucrăm cu ${v.name} pentru ${v.short[0]}.`:` and we’d love to work with ${v.name} on ${v.short[1]}.`));
    if(t!==2){const b=[L(v.need),...facts];lines.push((ro?'Câteva detalii:\n':'A few details:\n')+b.map(x=>'• '+x).join('\n'));}
    else if(facts.length)lines.push((ro?'Pe scurt: ':'In short: ')+[L(v.need),...facts].join(', ')+'.');
    if(att)lines.push(att);
    lines.push(ro?`Ne puteți trimite o ofertă orientativă și ce include prețul (${v.inc[0]})?`:`Could you send us an estimate and what the price includes (${v.inc[1]})?`);
  }else if(it===1){
    subj=ro?`Disponibilitate${c.date?' '+date:''} · ${v.cat[0]}`:`Availability${c.date?' '+date:''} · ${v.cat[1]}`;
    lines.push(intro+'.');
    lines.push(ro?`Sunteți disponibili în acea zi pentru ${v.short[0]}? Dacă da, ne-ar plăcea să vorbim despre o ofertă.`:`Are you available that day for ${v.short[1]}? If so, we’d love to talk about a quote.`);
    if(facts.length&&t!==2)lines.push((ro?'Ca să vă faceți o idee: ':'To give you an idea: ')+facts.join(', ')+'.');
  }else if(it===2){
    subj=ro?`Revenire · ${v.cat[0]} nuntă`:`Following up · wedding ${v.cat[1]}`;
    lines.push(ro?`Revin la mesajul nostru de pe 5 noiembrie despre ${v.short[0]}${c.date?` pentru ${date}`:''}.`:`Just following up on our message from 5 November about ${v.short[1]}${c.date?` for ${date}`:''}.`);
    lines.push(ro?'Ne-ar ajuta mult o ofertă până la finalul săptămânii, ca să putem decide.':'A quote by the end of the week would really help us decide.');
    if(att)lines.push(ro?'Atașez din nou imaginile, ca să le aveți la îndemână.':'I’m attaching the pictures again so you have them handy.');
  }else if(it===3){
    subj=ro?`Despre oferta pentru ${v.cat[0]}`:`About the ${v.cat[1]} quote`;
    lines.push(ro?`Mulțumim pentru oferta${v.quote?' de '+v.quote:''}, ne place mult ce faceți.`:`Thank you for the quote${v.quote?' of '+v.quote:''}, we really like your work.`);
    lines.push(ro?`Bugetul nostru pentru ${v.cat[0]} e în jur de ${v.bud}. Se poate adapta pachetul, de exemplu cu elemente de sezon sau mai puține piese?`:`Our budget for ${v.cat[1]} is around ${v.bud}. Could the package be adjusted, for example with seasonal options or fewer pieces?`);
  }else{
    subj=ro?`Confirmare · ${v.cat[0]}${c.date?' '+date:''}`:`Confirmation · ${v.cat[1]}${c.date?' '+date:''}`;
    lines.push(ro?`Ne-am hotărât și am vrea să rezervăm ${v.name}${c.date?` pentru ${date}`:''}.`:`We’ve decided and would like to book ${v.name}${c.date?` for ${date}`:''}.`);
    lines.push(ro?'Care sunt pașii pentru contract și cât este avansul?':'What are the next steps for the contract, and how much is the deposit?');
  }
  return {subj, body:[hi,...lines,bye].join('\n\n')};
}

window.vSend=()=>{
  const b=document.getElementById('vdBody'), txt=(b?b.innerText:vBody()).trim();
  if(!txt){if(b)b.focus();notify({type:'error',title:_('Mesajul e gol','The message is empty'),sub:_('Scrie câteva rânduri sau apasă Rescrie.','Write a few lines or tap Rewrite.')});return;}
  vd.body=txt;
  if(vd.chan==='copy'){try{if(navigator.clipboard)navigator.clipboard.writeText(txt).catch(()=>{});}catch(_e){} vDone(_('Text copiat','Text copied'),_('Lipește-l unde vorbești cu furnizorul','Paste it wherever you talk to the vendor'));return;}
  go('vsend');
};
function vDone(title,sub){
  const v=vGet(vd.id), was=vd.used<vd.limit;
  if(was)vd.used++;
  const ch=vd.chan==='mail'?'Email':vd.chan==='wa'?'WhatsApp':_('copiat','copied');
  const what=[['Cerere de ofertă trimisă','Quote request sent'],['Întrebare de disponibilitate trimisă','Availability question sent'],['Follow-up trimis','Follow-up sent'],['Mesaj de negociere trimis','Negotiation message sent'],['Confirmare trimisă','Confirmation sent']][vd.intent];
  v.log.push([['azi','today'],[`${what[0]} · ${ch}`,`${what[1]} · ${ch}`]]);
  if(v.st==='none')v.st='asked'; if(v.st==='asked'&&vd.intent===2)v.days=0; if(vd.intent===4)v.st='booked';
  vd.body=null; while(hist.length&&['vendor','vdraft','vsend'].includes(hist[hist.length-1]))hist.pop(); cur='vendor'; render();
  successToast(title,sub||`${_('Status','Status')}: ${_(...vStat(v)[0])}`);
}
window.vSent=()=>{const v=vGet(vd.id);vDone(_(`Trimis către ${v.name}`,`Sent to ${v.name}`));};

 [0.66,'#f0ebe4,#ddd2c4',[['umeri goi','off-shoulder']]],
 [0.86,'#efe9e3,#dacdbf',[['sirenă','mermaid']]],
 [0.7,'#f3eee7,#e2d8cb',[['dantelă','lace']]],

 [0.78,'#efe8e0,#d8cab9',[['corset','corset'],['dantelă','lace']]]
];

  const f=col.filter; if(f===0)return COL_ITEMS.map((x,i)=>i);
  if(f===1)return [...col.fav];
  const key=COL_FILTERS[f][0].toLowerCase();
  return COL_ITEMS.map((x,i)=>i).filter(i=>COL_ITEMS[i][2].some(t=>t[0]===key));
}

/* ===== Scroll motion: content eases in, progress bars fill, numbers count up, quick links bubble ===== */
const RM=()=>window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const REVEAL_SEL='.screen > *:not(.tl-bar):not(.hrow):not(.f-quick):not(.masonry), .task, .f-q, .ctile, .f-art, .f-act, .f-colw, .f-pl, .f-vid, .kv, .sh-row';
const BAR_SEL='.f-bar i, .f-gbar i, .bar i, .subbar i';
/* overlays (sheets, scrims, menus, toasts, full-screen layers) are never part of the scroll reveal */
const RV_SKIP='.sheet,.scrim,.qa-scrim,.ts,.qa,.toast,.stoast,.menu,[role="dialog"]';
function rvInFlow(e){
  if(e.closest(RV_SKIP))return false;
  for(let n=e;n&&n.id!=='screen';n=n.parentElement){const p=getComputedStyle(n).position;if(p==='absolute'||p==='fixed'||p==='sticky')return false;}
  return true;
}
function countUp(el){
  const to=parseFloat(el.dataset.count), suf=el.dataset.suffix||'', pre=el.dataset.prefix||'', t0=performance.now(), d=1100;
  const fmt=v=>pre+(to>=1000?Math.round(v).toLocaleString('ro-RO'):Math.round(v))+suf;
  const step=t=>{const k=Math.min(1,(t-t0)/d), e=1-Math.pow(1-k,3); el.textContent=fmt(to*e); if(k<1)requestAnimationFrame(step); else if(el.dataset.final)el.textContent=el.dataset.final;};
  requestAnimationFrame(step);
}
function rvFinish(t){ /* show immediately, no motion */
  t.classList.remove('rv','in','bub');t.style.transitionDelay='';
  if(t.dataset.w!==undefined&&t.matches(BAR_SEL))t.style.width=t.dataset.w;
  if(t.dataset.count!==undefined&&t.dataset.final)t.textContent=t.dataset.final;
}
function animateScreen(same){
  /* ROUND 35 · smooth reveal: reading order (top→bottom, left→right), one ease-out curve, no spring, no mid-flight snapping */
  const sc=document.getElementById('screen'); if(!sc)return;
  if(window.__rvOff){window.__rvOff();window.__rvOff=null;}
  if(same||RM()||!sc.getBoundingClientRect||!window.getComputedStyle)return;
  let pend=[];
  try{
    const els=[...new Set(sc.querySelectorAll(REVEAL_SEL))].filter(e=>(!e.closest('.acc-b')||e.closest('.acc.open'))&&rvInFlow(e));
    const bars=[...sc.querySelectorAll(BAR_SEL)].filter(rvInFlow), counts=[...sc.querySelectorAll('[data-count]')].filter(rvInFlow);
    els.forEach(e=>e.classList.add('rv'));
    bars.forEach(b=>{b.dataset.w=b.dataset.w||b.style.width;b.style.width='0';b.classList.add('bar-anim');});
    counts.forEach(c=>{c.dataset.final=c.dataset.final||c.textContent;c.textContent=(c.dataset.prefix||'')+'0'+(c.dataset.suffix||'');});
    pend=[...new Set([...els,...bars,...counts])];
  }catch(err){ sc.querySelectorAll('.rv').forEach(rvFinish); return; } /* fail open */
  const STEP=55, CAP=600;
  let queue=[], raf=0;
  const play=(t,delay)=>{
    if(t.classList.contains('rv')){
      t.style.transitionDelay=delay+'ms';
      requestAnimationFrame(()=>t.classList.add('in'));
      let to;
      const done=e=>{if(e&&(e.target!==t||e.propertyName!=='transform'))return;clearTimeout(to);t.removeEventListener('transitionend',done);t.classList.remove('rv','in');t.style.transitionDelay='';};
      t.addEventListener('transitionend',done); to=setTimeout(done,900+delay);
    }
    if(t.dataset.w!==undefined&&t.matches(BAR_SEL))setTimeout(()=>{t.style.width=t.dataset.w;},delay+160);
    if(t.dataset.count!==undefined)setTimeout(()=>countUp(t),delay+160);
  };
  const flush=()=>{raf=0;
    /* rows first (16px bands), then left to right inside a row */
    queue.sort((a,b)=>a.y-b.y||a.x-b.x);
    let i=-1,lastKey=null;
    queue.forEach(q=>{const key=q.t.matches(BAR_SEL)||q.t.dataset.count!==undefined?null:q.y+':'+q.x;if(key!==lastKey)i++;lastKey=key;play(q.t,Math.min(Math.max(i,0)*STEP,CAP));});
    queue=[];
  };
  const enqueue=t=>{const b=t.getBoundingClientRect();queue.push({t,y:Math.round(b.top/16),x:Math.round(b.left)});if(!raf)raf=requestAnimationFrame(flush);};
  const check=()=>{
    if(!pend.length)return;
    const r=sc.getBoundingClientRect(), vb=Math.min(r.bottom,window.innerHeight||r.bottom), lim=vb-8;
    pend=pend.filter(t=>{
      if(!t.isConnected)return false;
      const b=t.getBoundingClientRect();
      if(!b.width&&!b.height){rvFinish(t);return false;}
      if(b.top<lim){enqueue(t);return false;}
      return true;
    });
  };
  const onS=()=>requestAnimationFrame(check);
  document.addEventListener('scroll',onS,{passive:true,capture:true}); window.addEventListener('resize',onS);
  requestAnimationFrame(()=>requestAnimationFrame(check));   /* one pass after layout: the whole first screen goes in reading order */
  const ts=[setTimeout(check,700)];
  window.__rvOff=()=>{document.removeEventListener('scroll',onS,{capture:true});window.removeEventListener('resize',onS);ts.forEach(clearTimeout);if(raf)cancelAnimationFrame(raf);pend.forEach(t=>{if(t.isConnected)rvFinish(t);});pend=[];queue=[];};
}

/* ---------- haptics: Android = Vibration API · iOS 18+ Safari = native switch tick ---------- */
const haptic=(()=>{
  let lbl=null;
  const tick=()=>{try{if(!lbl){lbl=document.createElement('label');lbl.className='hap';lbl.setAttribute('aria-hidden','true');lbl.style.cssText='position:fixed;left:-200px;top:0;width:1px;height:1px;opacity:0;pointer-events:none';const i=document.createElement('input');i.type='checkbox';i.setAttribute('switch','');i.tabIndex=-1;lbl.appendChild(i);document.body.appendChild(lbl);}lbl.click();}catch(e){}};
  const P={select:[6],light:[9],medium:[16],heavy:[24],success:[10,70,16],warning:[18,60,18],error:[22,50,22,50,22]};
  return kind=>{
    if(RM&&RM()&&kind==='select')return;
    if(navigator.vibrate){try{navigator.vibrate(P[kind]||P.light);}catch(e){}return;}
    const ae=document.activeElement;if(ae&&(ae.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))&&!ae.closest('.hap'))return;
    tick(); if(kind==='success'||kind==='warning')setTimeout(tick,90); if(kind==='error'){setTimeout(tick,80);setTimeout(tick,160);}
  };
})();
window.haptic=haptic;

/* ---------- confetti (Tiimo style): lavender dots, flakes and curls burst up, then flutter down the whole screen ---------- */
const CF_COLS=['#3f2a9c','#5b40d6','#7c62e6','#9d86f2','#b8a7f7','#d2c7fb'];
function confetti(){
  if(RM())return;
  const inner=document.querySelector('.inner');if(!inner)return;
  let box=inner.querySelector('.cf-box');if(!box){box=document.createElement('div');box.className='cf-box';box.setAttribute('aria-hidden','true');inner.appendChild(box);}
  const W=inner.clientWidth,H=inner.clientHeight,ox=W*.5,oy=H*.34;
  for(let k=0;k<78;k++){
    const p=document.createElement('i'),kind=k%3,s=kind===0?5+Math.random()*4:kind===1?7+Math.random()*5:11+Math.random()*8;
    p.className='cf cf-'+['dot','flake','curl'][kind];
    p.style.width=s+'px';p.style.height=(kind===1?s*.5:s)+'px';
    p.style.setProperty('--c',CF_COLS[(Math.random()*CF_COLS.length)|0]);
    box.appendChild(p);
    /* tiny physics: burst, air drag, gravity, sideways flutter */
    const ang=(-160+Math.random()*140)*Math.PI/180,sp=380+Math.random()*620;
    let x=ox+(Math.random()-.5)*30,y=oy+(Math.random()-.5)*20,vx=Math.cos(ang)*sp,vy=Math.sin(ang)*sp;
    const T=2.4+Math.random()*1.2,dt=1/30,amp=10+Math.random()*22,fr=1.2+Math.random()*1.8,ph=Math.random()*6.28,spin=(Math.random()*2-1)*540,flip=200+Math.random()*500;
    const kf=[];let t=0,step=0;
    while(t<=T){
      if(step%3===0){const sway=t>.35?Math.sin(ph+t*fr*6.28)*amp:0;kf.push({transform:`translate(${(x+sway).toFixed(1)}px,${y.toFixed(1)}px) rotate(${(spin*t).toFixed(0)}deg)`,opacity:t>T*.82?Math.max(0,1-(t-T*.82)/(T*.18)):1});}
      vx*=1-2.6*dt;vy=vy*(1-1.6*dt)+760*dt;if(vy>150+Math.random()*30)vy=150;x+=vx*dt;y+=vy*dt;t+=dt;step++;
    }
    const a=p.animate(kf,{duration:T*1000,easing:'linear',fill:'forwards'});a.onfinish=()=>p.remove();
  }
}

function weekLabel(w){const a=new Date(PLAN_START.getTime()+w*7*864e5),b=new Date(a.getTime()+6*864e5);
  const ro=lang==='ro',m=d=>d.toLocaleDateString(ro?'ro-RO':'en-US',{month:'short'}).replace('.','');
  return ro?(a.getMonth()===b.getMonth()?`${a.getDate()}–${b.getDate()} ${m(b)}`:`${a.getDate()} ${m(a)} – ${b.getDate()} ${m(b)}`)+(a.getFullYear()!==2026?' '+a.getFullYear():'')

function allView(){

  Object.keys(byW).map(Number).sort((a,b)=>a-b).forEach(w=>{
    const d=new Date(PLAN_START.getTime()+w*7*864e5);
    if(d.getMonth()!==lastM){lastM=d.getMonth();html+=`<div class="wk-month">${_(...OB_MON[lastM])} ${d.getFullYear()}</div>`;}
    const tag=w===0?_('Săptămâna asta','This week'):w===39?_('Săptămâna nunții','Wedding week'):_(`Săpt. ${w+1}`,`Week ${w+1}`);
    html+=`<section class="wk"><div class="wk-h"><b>${weekLabel(w)}</b><span>${tag} · ${byW[w].length}</span></div>${byW[w].map(t=>task(t.id,t.e,_(...t.t),'')).join('')}</section>`;
  });
  return `<div class="all-view">${html||`<p class="small muted">${_('Nimic cu filtrele alese.','Nothing with these filters.')}</p>`}</div>`;

if(!MIP.play)MIP.play='M8 5v14l11-7z';
function moodMaybe(){if(MOOD.asked||MOOD.set!=null)return;if(hist.some(h=>/^(ob\d+|notif|signup|saved|saving|welcome|splash)$/.test(h)))return;MOOD.asked=true;
  setTimeout(()=>{if(cur==='timeline'||cur==='home')go('mood');},650);}
['timeline','home'].forEach(id=>{const a=S[id].after;S[id].after=function(){if(a)a.apply(this,arguments);moodMaybe();};});

/* ---------- Hub widgets ---------- */
const hubMood=()=>{const s=MOOD.set;return s==null?`<button type="button" class="hw-mood" onclick="haptic('light');go('mood')"><span class="hw-mood-b">${moodBlob(3,'h')}</span><span><b>${_('Cum îți e azi?','How are you today?')}</b><small>${_('Mira are un gând pentru tine','Mira has a thought for you')}</small></span>${mi('chevron_right',20)}</button>`
 :`<button type="button" class="hw-mood" style="background:${MOODS[s].bg}" onclick="haptic('light');go('moodmsg')"><span class="hw-mood-b">${moodBlob(s,'h')}</span><span><b>${_('Azi','Today')}: ${_(...MOODS[s].n)}</b><small>${_('Revezi gândul Mirei','See Mira’s note again')}</small></span>${mi('chevron_right',20)}</button>`;};
const hubGuests=()=>{const st=invStats(),inv=INV_BASE.invited,wait=Math.max(0,inv-st.coming-st.notcoming),pc=v=>(v/inv*100).toFixed(1)+'%';return `<h3 class="f-h">${_('Invitați','Guests')}</h3>
<div class="f-card hw-guests" role="button" tabindex="0" onclick="go('guests')"><div class="row"><span class="f-lbl">${_('Confirmări','RSVPs')}</span><span class="f-lbl">${inv} ${_('invitați','guests')}</span></div>
<div class="hw-gnum"><b class="num" data-count="${st.coming}">${st.coming}</b><span>${_('vin','coming')}</span></div>
<div class="hw-seg" aria-hidden="true"><i style="width:${pc(st.coming)};background:#11845f"></i><i style="width:${pc(st.notcoming)};background:#e07a6f"></i><i style="width:${pc(wait)};background:#e4e2e8"></i></div>
<div class="hw-leg"><span><i style="background:#11845f"></i>${st.coming} ${_('vin','coming')}</span><span><i style="background:#e07a6f"></i>${st.notcoming} ${_('nu vin','not coming')}</span><span><i style="background:#e4e2e8"></i>${wait} ${_('așteaptă','waiting')}</span></div>
<div class="hw-inv" onclick="event.stopPropagation();go('invites')"><span>💌 ${INV.paid?_('Invitația e publicată','Invitation is live'):_('Invitația e încă ciornă','Invitation is still a draft')}</span>${mi('chevron_right',18)}</div></div>`;};
const BACH_WHEN=new Date('2027-07-10T20:00:00+03:00');
const hubBach=()=>{const d=Math.max(0,Math.ceil((BACH_WHEN-new Date())/864e5));return `<div class="hw-bach"><div class="hw-bach-top"><span class="hw-bach-e" aria-hidden="true">🪩</span><span class="hw-bach-tag">${_('Doar pentru fete','Girls only')}</span></div>
<h3>${_('Petrecerea burlăcițelor','Bachelorette party')}</h3><p>${_(`peste ${d} de zile · 10 iulie 2027`,`in ${d} days · 10 July 2027`)}</p>
<ul class="hw-bach-l"><li class="ok">${mi('check',16)}${_('Data e aleasă','Date is set')}</li><li>${_('Locația și tematica','Venue and theme')}</li><li><span>${_('Invitate','Invitees')} · <b>8/12</b> ${_('au confirmat','confirmed')}</span></li></ul>
<div class="hw-bach-a"><button type="button" class="f-black" onclick="haptic('light');go('mira')">${_('Planifică cu Mira','Plan with Mira')}</button><button type="button" class="hw-bach-2" onclick="haptic('light');toast(_('Se deschide meniul de distribuire','Opens the share menu'))">${mi('share',18)} ${_('Invită fetele','Invite the girls')}</button></div></div>`;};
const hubRate=()=>HUB.rateDone?`<div class="hw-rate"><div class="hw-rate-e" aria-hidden="true">💜</div><h3>${_('Mulțumim!','Thank you!')}</h3><p>${HUB.rate>=4?_('Ne bucurăm enorm. O recenzie în App Store ne ajută să ajungem la mai multe cupluri.','That means a lot. An App Store review helps us reach more couples.'):_('Am primit mesajul. Îl citim cu atenție.','We got your message. We’ll read it carefully.')}</p>${HUB.rate>=4?`<button type="button" class="pw-restore" onclick="toast(_('Se deschide App Store','Opens the App Store'))">${_('Scrie o recenzie','Write a review')}</button>`:''}</div>`
 :`<div class="hw-rate"><h3>${_('Îți place Mira?','Enjoying Mira?')}</h3><p>${_('O notă de la tine ne ajută enorm.','A rating from you helps us a lot.')}</p>
<div class="hw-stars" role="radiogroup" aria-label="${_('Notează aplicația','Rate the app')}">${[1,2,3,4,5].map(n=>`<button type="button" role="radio" aria-checked="${HUB.rate===n}" aria-label="${n} ${_('din 5','of 5')}" class="${HUB.rate>=n?'on':''}" onclick="hubRateSet(${n})">★</button>`).join('')}</div>
<div id="hwRateMore">${HUB.rate&&HUB.rate<4?hubRateForm():''}</div></div>`;
const hubRateForm=()=>`<label class="gs-lbl" for="hwFb">${_('Ce putem face mai bine?','What could we do better?')}</label><textarea id="hwFb" class="gs-in" rows="3" maxlength="500"></textarea><button type="button" class="obf-btn ink" style="margin-top:12px" onclick="hubRateSend()">${_('Trimite','Send')}</button>`;
window.hubRateSet=n=>{n=Math.max(1,Math.min(5,parseInt(n,10)||0));haptic('select');HUB.rate=n;
  document.querySelectorAll('#screen .hw-stars button').forEach((b,i)=>{b.classList.toggle('on',i<n);b.setAttribute('aria-checked',String(i+1===n));if(i<n)fsPop(b);});
  if(n>=4){setTimeout(()=>{HUB.rateDone=true;haptic('success');confetti();const c=document.querySelector('#screen .hw-rate');if(c)c.outerHTML=hubRate();},450);}
  else{const m=document.getElementById('hwRateMore');if(m&&!m.innerHTML)m.innerHTML=hubRateForm();}};
window.hubRateSend=()=>{const t=document.getElementById('hwFb');HUB.rateDone=true;haptic('success');const c=document.querySelector('#screen .hw-rate');if(c)c.outerHTML=hubRate();};
window.hubProClose=()=>{haptic('light');const b=document.querySelector('#screen .f-pro');HUB.proOff=true;if(!b)return;
  if(RM()){b.remove();return;}b.style.height=b.offsetHeight+'px';b.classList.add('closing');requestAnimationFrame(()=>{b.style.height='0px';});setTimeout(()=>b.remove(),420);};
render();
})();


</script>
